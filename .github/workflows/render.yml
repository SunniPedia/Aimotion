name: Render Video
on:
  workflow_dispatch:
    inputs:
      theme:
        description: Theme to render
        required: true
        type: choice
        default: podcast
        options:
          - podcast
          - infographic
          - both
      quality:
        description: Render quality
        required: true
        type: choice
        default: preview
        options:
          - preview
          - full
      audio_volume:
        description: Audio volume (1.0 = original)
        required: true
        type: string
        default: '1.0'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-noto-extra
          sudo fc-cache -f
      - name: Ensure SolaimanLipi fonts exist
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/SolaimanLipi-Regular.ttf ]; then
            curl -fL --retry 2 'https://fonts.maateen.me/solaiman-lipi/solaimanlipi-normal-v1.0.ttf' -o assets/fonts/SolaimanLipi-Regular.ttf || { rm -f assets/fonts/SolaimanLipi-Regular.ttf; echo '::warning::SolaimanLipi download failed. Upload SolaimanLipi-Regular.ttf to assets/fonts/ manually.'; }
          fi
          if [ ! -f assets/fonts/SolaimanLipi-Bold.ttf ]; then
            curl -fL --retry 2 'https://fonts.maateen.me/solaiman-lipi/solaimanlipi-bold-v1.0.ttf' -o assets/fonts/SolaimanLipi-Bold.ttf || { rm -f assets/fonts/SolaimanLipi-Bold.ttf; echo '::warning::SolaimanLipi bold download failed. Upload SolaimanLipi-Bold.ttf to assets/fonts/ manually.'; }
          fi
          sudo fc-cache -f
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Render podcast
        if: inputs.theme == 'podcast' || inputs.theme == 'both'
        env:
          THEME: podcast
          WIDTH: ${{ inputs.quality == 'full' && '1920' || '960' }}
          FPS: ${{ inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ inputs.audio_volume }}
        run: node render.js
      - name: Render infographic
        if: inputs.theme == 'infographic' || inputs.theme == 'both'
        env:
          THEME: infographic
          WIDTH: ${{ inputs.quality == 'full' && '1080' || '540' }}
          FPS: ${{ inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ inputs.audio_volume }}
        run: node render.js
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/*.mp4
          retention-days: 14
