name: Render Video
on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme'
        required: true
        default: 'both'
        type: choice
        options: ['podcast','infographic','both']
      quality:
        description: 'Quality'
        required: true
        default: 'preview'
        type: choice
        options: ['preview','full']
      audio_volume:
        description: 'Audio volume'
        required: false
        default: '1.0'
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-noto-extra
          sudo fc-cache -f
      - name: Ensure SolaimanLipi
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/SolaimanLipi-Regular.ttf ]; then curl -L -o assets/fonts/SolaimanLipi-Regular.ttf https://fonts.maateen.me/solaiman-lipi/solaimanlipi-normal-v1.0.ttf || { echo "::warning:: upload TTF manually"; rm -f assets/fonts/SolaimanLipi-Regular.ttf; }; fi
          if [ ! -f assets/fonts/SolaimanLipi-Bold.ttf ]; then curl -L -o assets/fonts/SolaimanLipi-Bold.ttf https://fonts.maateen.me/solaiman-lipi/solaimanlipi-bold-v1.0.ttf || cp assets/fonts/SolaimanLipi-Regular.ttf assets/fonts/SolaimanLipi-Bold.ttf 2>/dev/null || true; fi
          ls -lh assets/fonts/ || true
      - name: npm install
        run: npm install
      - name: playwright
        run: npx playwright install --with-deps chromium
      - name: Render podcast
        if: ${{ inputs.theme == 'podcast' || inputs.theme == 'both' }}
        env:
          THEME: podcast
          WIDTH: ${{ inputs.quality == 'full' && '1920' || '960' }}
          FPS: ${{ inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ inputs.audio_volume }}
          OUT: out/video-podcast-${{ inputs.quality }}.mp4
        run: mkdir -p out && node render.js
      - name: Render infographic
        if: ${{ inputs.theme == 'infographic' || inputs.theme == 'both' }}
        env:
          THEME: infographic
          WIDTH: ${{ inputs.quality == 'full' && '1080' || '540' }}
          FPS: ${{ inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ inputs.audio_volume }}
          OUT: out/video-infographic-${{ inputs.quality }}.mp4
        run: mkdir -p out && node render.js
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ inputs.theme }}-${{ inputs.quality }}
          path: out/*.mp4
          retention-days: 14
