name: Render Video

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Which theme to render'
        type: choice
        options: [podcast, infographic, both]
        default: podcast
      quality:
        description: 'preview (small, 15 fps) or full (full size, 30 fps)'
        type: choice
        options: [preview, full]
        default: preview
      audio_volume:
        description: 'Audio volume (1.0 = unchanged)'
        type: string
        default: '1.0'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg and Noto fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          fc-cache -f

      - name: Fetch SolaimanLipi (only if not in the repo)
        run: |
          mkdir -p assets/fonts
          get() {
            if [ -s "assets/fonts/$1" ]; then echo "$1 found in repo, keeping it"; return; fi
            if ! curl -fsSL --retry 3 -o "assets/fonts/$1" "$2"; then
              rm -f "assets/fonts/$1"
              echo "::warning::Could not download $1. Upload assets/fonts/$1 manually. Falling back to Noto Serif Bengali."
            fi
          }
          get SolaimanLipi-Regular.ttf https://fonts.maateen.me/solaiman-lipi/solaimanlipi-normal-v1.0.ttf
          get SolaimanLipi-Bold.ttf https://fonts.maateen.me/solaiman-lipi/solaimanlipi-bold-v1.0.ttf
          ls -la assets/fonts

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render podcast (16:9)
        if: ${{ inputs.theme == 'podcast' || inputs.theme == 'both' }}
        env:
          THEME: podcast
          WIDTH: ${{ inputs.quality == 'full' && '1920' || '960' }}
          FPS: ${{ inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ inputs.audio_volume }}
        run: node render.js

      - name: Render infographic (9:16)
        if: ${{ inputs.theme == 'infographic' || inputs.theme == 'both' }}
        env:
          THEME: infographic
          WIDTH: ${{ inputs.quality == 'full' && '1080' || '540' }}
          FPS: ${{ inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ inputs.audio_volume }}
        run: node render.js

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/*.mp4
          retention-days: 14
