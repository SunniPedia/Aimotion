name: Render Video

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "preview = দ্রুত ছোট ভিডিও, full = 1080x1920 30fps"
        type: choice
        default: preview
        options:
          - preview
          - full

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install fonts and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-noto-extra
          fc-cache -f
          fc-list | grep -i -E "bengali|naskh" | head -5

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render video
        env:
          WIDTH: ${{ github.event.inputs.quality == 'full' && '1080' || '540' }}
          FPS: ${{ github.event.inputs.quality == 'full' && '30' || '15' }}
        run: node render.js

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 14
