html,body{width:1920px;height:1080px;overflow:hidden;background:#021208}
body{font-family:'Noto Serif','SolaimanLipi','Noto Serif Bengali','Noto Sans Bengali',serif;color:var(--cream)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}

#bg{inset:0;background:radial-gradient(120% 90% at 70% 35%,#0a4a2a,#04210f 55%,#021208)}

.vis{position:absolute;inset:0;visibility:hidden;opacity:0}
.glow{position:absolute;left:50%;top:50%;width:92%;height:92%;transform:translate(-50%,-50%)}
.inner{position:absolute;left:50%;top:50%;width:max-content;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%)}
.inner.bottom{top:auto;bottom:26px;transform:translate(-50%,0)}
.card{display:flex;align-items:center;justify-content:center;gap:28px;background:linear-gradient(160deg,rgba(20,128,74,.62),rgba(4,33,15,.92));border:3px solid rgba(233,196,106,.9);box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 0 26px rgba(233,196,106,.12)}
.ci,.nicon,.emo{font-family:'Noto Color Emoji','Noto Serif',sans-serif;line-height:1.1}
.cl{font-weight:700;color:var(--cream);text-align:center;line-height:1.25}
.arab{font-family:'Noto Naskh Arabic','Noto Serif',serif;direction:rtl;color:var(--gold);font-weight:700;line-height:1.5;white-space:nowrap}
.numw{display:flex;flex-direction:column;align-items:center}
.num{font-weight:700;color:var(--gold);line-height:1.1;text-shadow:0 0 30px rgba(233,196,106,.55),0 4px 0 rgba(0,0,0,.35);white-space:nowrap}
.numl{font-weight:700;color:var(--cream);line-height:1.3;text-align:center}
.badgeWrap{position:relative;display:inline-block}

.appname{font-weight:700;color:var(--gold);text-align:center;text-shadow:0 0 22px rgba(233,196,106,.5);line-height:1.3;white-space:nowrap}

  if (s.numIcon && d.type === 'number') s.numIcon.style.transform = 'scale(' + (0.6 + 0.4 * easeBack(prog(lt, 0.3, 0.7))).toFixed(3) + ')';
  if (s.orn) s.orn.style.transform = 'scale(' + (0.6 + 0.4 * easeBack(prog(lt, 0.3, 0.8))).toFixed(3) + ') rotate(' + (Math.sin(1.2 * t) * 4).toFixed(2) + 'deg)';
  if (d.type === 'store') {
    var pb = easeBack(prog(lt, 0.4, 0.7));
    s.badgeWrap.style.transform = 'translateY(' + (Math.sin(2 * t) * 6).toFixed(2) + 'px) scale(' + (0.4 + 0.6 * pb).toFixed(4) + ')';
    s.badgeWrap.style.opacity = easeOut(prog(lt, 0.4, 0.35)).toFixed(3);
    var u = lt >= 2.0 ? ((lt - 2.0) % 1.3) / 1.3 : -1;
    s.tap.style.opacity = u >= 0 ? ((1 - u) * 0.85).toFixed(3) : '0';
    s.tap.style.transform = 'translate(-50%,-50%) scale(' + (u >= 0 ? 0.3 + 1.0 * easeOut(u) : 0.3).toFixed(4) + ')';
    s.appName.style.opacity = easeOut(prog(lt, 1.2, 0.5)).toFixed(3);
    s.appName.style.transform = 'translateY(' + ((1 - easeOut(prog(lt, 1.2, 0.5))) * 20).toFixed(1) + 'px)';
  }
  if (d.type === 'closing') {
    for (i = 0; i < s.cardEls.length; i++) {
      var pe = easeBack(prog(lt, 0.4 + 0.3 * i, 0.7));
      s.cardEls[i].style.transform = 'translateY(' + (Math.sin(1.8 * t + i * 1.3) * 7).toFixed(2) + 'px) scale(' + (0.2 + 0.8 * pe).toFixed(4) + ')';
      s.cardEls[i].style.opacity = easeOut(prog(lt, 0.4 + 0.3 * i, 0.4)).toFixed(3);
    }
  }
  /* karaoke words + mouth */
  var mouth = 0;
  for (i = 0; i < s.words.length; i++) {
    var w = s.words[i], a = easeOut(prog(lt, w.st, 0.12)) * (1 - easeOut(prog(lt, w.en - 0.05, 0.14)));
    var fi = easeOut(prog(lt, w.st, 0.3)), we = w.el.style;
    we.opacity = fi.toFixed(3);
    we.transform = 'translateY(' + ((1 - fi) * 26 - 6 * a).toFixed(2) + 'px) scale(' + (1 + 0.07 * a).toFixed(4) + ')';
    if (w.hl) we.textShadow = '0 0 ' + (12 + 34 * a).toFixed(1) + 'px rgba(233,196,106,' + (0.45 + 0.45 * a).toFixed(2) + ')';
    else {
      we.color = 'rgb(' + mixc(CREAM[0], GOLD[0], a) + ',' + mixc(CREAM[1], GOLD[1], a) + ',' + mixc(CREAM[2], GOLD[2], a) + ')';
      we.textShadow = a > 0.002 ? '0 0 ' + (34 * a).toFixed(1) + 'px rgba(233,196,106,' + (0.9 * a).toFixed(2) + ')' : 'none';
    }
    var mm = a * (0.30 + 0.70 * Math.abs(Math.sin(lt * 13 + i * 1.7)));
    if (mm > mouth) mouth = mm;
  }
  s.mouth = mouth * (0.75 + 0.25 * lv);
  return o;
}

/* ---------- public API ---------- */
window.init = function (raw, opts) {
  st.opts = opts || {};
  st.scenes = parseTs(raw);
  if (!st.scenes.length) throw new Error('timestamps: no scenes found');
  st.bn = /[ঀ-৿]/.test(raw);
  var n = st.scenes.length, last = st.scenes[n - 1];
  st.dur = last.end + 0.5;
  st.scenes.forEach(function (s, i) { s.dsg = design(s, i, n, T.S); });
  var b = st.scenes.filter(function (s) { return s.dsg.type === 'brand'; })[0];
  var sc = st.scenes.filter(function (s) { return s.dsg.type === 'store'; })[0];
  st.lay = {
    brandStart: b ? b.start : 0, brandEnd: b ? b.end : 6,
    lastStart: last.start,
    growAt: sc ? sc.start : (n >= 2 ? st.scenes[n - 2].start : last.start)
  };
  st.lay.shrinkAt = st.lay.brandEnd - 0.4;
  T.build(st);
  var proms = [];
  proms.push(new Promise(function (res) {
    T.logoImg.onload = function () { res(true); };
    T.logoImg.onerror = function () { console.warn('logo failed to load: ' + (st.opts.logo || 'assets/logo.png')); res(false); };
    T.logoImg.src = st.opts.logo || 'assets/logo.png';
  }));
  buildScenes();
  if (st.opts.badge) {
    proms.push(processBadge(st.opts.badge).then(function (url) {
      st.badgeUrl = url;
      st.badgeEls.forEach(function (im) {
        if (!url) { im.style.display = 'none'; return; }
        im.src = url; im.style.display = '';
      });
      return Promise.all(st.badgeEls.map(function (im) { return im.decode ? im.decode().catch(function () {}) : null; }));
    }));
  }
  window.__ready = st.ready = Promise.all(proms);
  window.seek(0);
  return st.dur;
};

window.fit = function () {
  var out = [];
  st.scenes.forEach(function (s) {
    var fs = T.capStart(s.plain.length), cap = s.cap, vs = cap.style.visibility, ct = cap.firstChild;
    cap.style.visibility = 'hidden'; cap.style.opacity = '1';
    function overflows() {
      var top = 1e9, bot = -1e9, wmax = 0;
      for (var i = 0; i < s.words.length; i++) {
        var e = s.words[i].el;
        top = Math.min(top, e.offsetTop); bot = Math.max(bot, e.offsetTop + e.offsetHeight);
        wmax = Math.max(wmax, e.offsetWidth);
      }
      return top < -1 || bot > cap.clientHeight + 1 || wmax > cap.clientWidth;
    }
    cap.style.fontSize = fs + 'px';
    while (fs > T.capMin && overflows()) { fs -= 2; cap.style.fontSize = fs + 'px'; }
    cap.style.visibility = vs;
    /* visual area: shrink the visual uniformly if it is larger than its area */
    var inner = s.inner, aw = T.area.clientWidth, ah = T.area.clientHeight;
    inner.style.transform = 'none';
    var iw = inner.offsetWidth, ih = inner.offsetHeight;
    s.vsc = Math.min(1, (aw * 0.97) / Math.max(iw, 1), (ah * 0.97) / Math.max(ih, 1));
    out.push({ scene: s.idx, font: fs, visualScale: +s.vsc.toFixed(3), overflow: overflows() });
  });
  window.seek(0);
  return out;
};

window.seek = function (t) {
  var lv = level(t), best = null, bo = 0;
  for (var i = 0; i < st.scenes.length; i++) {
    var o = updateScene(st.scenes[i], t, lv);
    if (o > bo) { bo = o; best = st.scenes[i]; }
  }
  var rgb = best ? MOODS[best.mood] : GOLD;
  T.frame({ t: t, lv: lv, sp: bo, rgb: rgb, m: best ? best.mouth : 0, best: best, dur: st.dur });
};

window.setAudio = function (envelope, fps) { st.env = envelope && envelope.length ? envelope : null; st.fps = fps || 30; };
window.__debug = function () { return { scenes: st.scenes.map(function (s) { return { start: s.start, end: s.end, mood: s.mood, type: s.dsg.type, cards: s.dsg.cards, nums: s.dsg.nums, plain: s.plain, hl: s.hlText, emoji: s.dsg.emoji }; }), lay: st.lay, dur: st.dur, theme: T.name, state: T._m !== undefined ? { mouth: T._m, arm: T._ang, logoScale: T._sc, headY: T._hy } : null }; };
})();

</script>
