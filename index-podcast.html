<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Podcast 16:9</title>

</head>
<body>
<div id="stage">
  <svg id="studio" class="abs" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>

  <svg id="host" class="abs" style="left:960px;top:100px" width="960" height="720" viewBox="0 0 960 720">

      <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8e"/><stop offset="1" stop-color="#c9973a"/></linearGradient>
    </defs>
    <!-- boom arm (behind the host) -->
    <g id="boom" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M150 720 L186 720" stroke="#1d2622" stroke-width="22"/>
      <path d="M168 716 L214 540 L332 345" stroke="#26302b" stroke-width="9"/>
      <path d="M168 716 L214 540 L332 345" stroke="#3e4c45" stroke-width="3"/>
      <circle cx="214" cy="540" r="11" fill="#c9973a" stroke="#8a6620" stroke-width="2"/>
    </g>
    <g id="htorso">
      <!-- neck + body -->
      <rect x="424" y="340" width="72" height="96" rx="22" fill="#a86f46"/>
      <path d="M236 720C236 560 262 452 372 418C410 408 430 404 460 404C490 404 510 408 548 418C658 452 684 560 684 720Z" fill="url(#kurG)" stroke="#b9a572" stroke-width="3"/>
      <path d="M330 470C318 540 316 620 322 700M590 470C602 540 604 620 598 700" stroke="#cfbf93" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M408 410C430 446 490 446 512 410L526 422C498 470 422 470 394 422Z" fill="url(#goldH)" stroke="#a87b25" stroke-width="2"/>
      <path d="M460 452V720" stroke="#c9973a" stroke-width="4"/>
      <g fill="url(#goldH)" stroke="#a87b25" stroke-width="2"><circle cx="460" cy="486" r="7"/><circle cx="460" cy="540" r="7"/><circle cx="460" cy="594" r="7"/><circle cx="460" cy="648" r="7"/></g>
      <!-- left arm (screen-left) -->
      <g id="armL" stroke-linecap="round" fill="none">
        <path d="M296 452C262 520 262 612 300 676" stroke="#b9a572" stroke-width="64"/>
        <path d="M296 452C262 520 262 612 300 676" stroke="#f3e8c8" stroke-width="58"/>
        <path d="M274 668L328 646" stroke="#c9973a" stroke-width="9"/>
        <ellipse cx="312" cy="690" rx="30" ry="22" fill="#b57a4f" stroke="#8f5a37" stroke-width="2"/>
      </g>
      <!-- right arm (gesture) -->
      <g id="armR" stroke-linecap="round" fill="none">
        <path d="M624 452C658 520 658 612 620 676" stroke="#b9a572" stroke-width="64"/>
        <path d="M624 452C658 520 658 612 620 676" stroke="#f3e8c8" stroke-width="58"/>
        <path d="M592 646L646 668" stroke="#c9973a" stroke-width="9"/>
        <ellipse cx="608" cy="690" rx="30" ry="22" fill="#b57a4f" stroke="#8f5a37" stroke-width="2"/>
      </g>
      <!-- head -->
      <g id="hhead">
        <ellipse cx="368" cy="252" rx="14" ry="24" fill="#b57a4f"/><ellipse cx="552" cy="252" rx="14" ry="24" fill="#b57a4f"/>
        <ellipse cx="460" cy="240" rx="92" ry="106" fill="url(#skinG)" stroke="#8f5a37" stroke-width="2"/>
        <path d="M372 238C366 330 410 392 460 394C510 392 554 330 548 238C538 276 510 296 460 296C410 296 382 276 372 238Z" fill="#26201c"/>
        <ellipse cx="460" cy="332" rx="36" ry="19" fill="#b57a4f"/>
        <path d="M418 314C432 296 452 302 460 308C468 302 488 296 502 314C490 318 474 316 460 318C446 316 430 318 418 314Z" fill="#26201c"/>
        <path d="M436 329Q460 347 484 329" stroke="#7a3b30" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g id="hmouth"><ellipse cx="460" cy="334" rx="17" ry="10" fill="#4a1612"/><ellipse cx="460" cy="338" rx="9" ry="4" fill="#b8564c"/></g>
        <path d="M460 246C454 262 450 270 458 275C464 277 470 275 473 272" stroke="#8f5a37" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="420" cy="238" rx="14" ry="10" fill="#fff8ee"/><ellipse cx="500" cy="238" rx="14" ry="10" fill="#fff8ee"/>
        <g id="hpupils"><circle cx="420" cy="239" r="5.6" fill="#2b1a10"/><circle cx="500" cy="239" r="5.6" fill="#2b1a10"/><circle cx="422" cy="237" r="1.7" fill="#fff"/><circle cx="502" cy="237" r="1.7" fill="#fff"/></g>
        <ellipse id="lidL" cx="420" cy="238" rx="15" ry="11" fill="#b57a4f"/><ellipse id="lidR" cx="500" cy="238" rx="15" ry="11" fill="#b57a4f"/>
        <g fill="rgba(255,255,255,.10)" stroke="#3a2c1c" stroke-width="4"><circle cx="420" cy="238" r="28"/><circle cx="500" cy="238" r="28"/></g>
        <path d="M448 235Q460 227 472 235M392 234L372 230M528 234L548 230" stroke="#3a2c1c" stroke-width="4" fill="none" stroke-linecap="round"/>
        <g id="hbrows" stroke="#26201c" stroke-width="7" fill="none" stroke-linecap="round"><path d="M392 207Q418 195 444 205"/><path d="M476 205Q502 195 528 207"/></g>
        <path d="M368 188C360 146 392 106 460 102C528 106 560 146 552 188C520 198 400 198 368 188Z" fill="#fffdf6" stroke="#cdc3a4" stroke-width="3"/>
        <path d="M368 188C400 198 520 198 552 188L553 170C520 180 400 180 367 170Z" fill="#f1e9d0" stroke="#cdc3a4" stroke-width="2"/>
        <path d="M410 112V176M435 105V178M460 103V180M485 105V178M510 112V176" stroke="#e7dfc4" stroke-width="2" fill="none"/>
        <path d="M354 250C340 62 580 62 566 250" stroke="#17241d" stroke-width="11" fill="none" stroke-linecap="round"/>
        <rect x="338" y="214" width="40" height="78" rx="17" fill="#0d3b24" stroke="#c9973a" stroke-width="4"/><rect x="542" y="214" width="40" height="78" rx="17" fill="#0d3b24" stroke="#c9973a" stroke-width="4"/>
        <circle cx="358" cy="253" r="9" fill="#14804a" stroke="#e9c46a" stroke-width="2"/><circle cx="562" cy="253" r="9" fill="#14804a" stroke="#e9c46a" stroke-width="2"/>
      </g>
    </g>
    <!-- mic capsule (in front of the face, on the left) -->
    <g transform="translate(332 345) rotate(-18)"><rect x="-4" y="-13" width="58" height="26" rx="13" fill="#2a312d" stroke="#4a5a52" stroke-width="2"/><ellipse cx="64" cy="0" rx="19" ry="21" fill="#55645c" stroke="#2a312d" stroke-width="3"/><path d="M54 -12V12M64 -16V16M74 -11V11" stroke="#7d8d84" stroke-width="2"/></g>
  </svg>

  <div id="desk" class="abs" style="left:0;top:800px;width:1920px;height:280px;background:linear-gradient(180deg,#6b4423 0%,#4a2e18 40%,#2f1c0e 100%);border-top:8px solid #c9973a;box-shadow:0 -10px 40px rgba(0,0,0,.45)"></div>

  <div id="screen" class="abs" style="left:80px;top:290px;width:940px;height:490px;border-radius:30px;border:6px solid #e9c46a;overflow:hidden;background:linear-gradient(160deg,#0a3d22,#04210f)">
    <div id="vis" class="abs" style="left:0;top:0;right:0;bottom:0;overflow:hidden"></div>
    <div class="abs" style="left:0;top:0;right:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 4px)"></div>
  </div>

  <div id="logo" class="abs" style="left:0;top:0;width:520px;transform-origin:50% 50%;opacity:0">
    <div id="lring" class="abs" style="left:0;top:0;right:0;bottom:0;border-radius:56px;border:6px solid #e9c46a;opacity:0"></div>
    <div id="lcard" style="border-radius:56px;border:6px solid #e9c46a;background:#fff;overflow:hidden"><img alt="" style="display:block;width:100%;height:auto"></div>
  </div>

  <div id="onair" class="abs" style="left:1590px;top:40px;width:270px;height:74px;border-radius:16px;border:3px solid #c9973a;background:linear-gradient(180deg,#2a0f0c,#150706);display:flex;align-items:center;justify-content:center;gap:16px">
    <div id="oadot" style="width:22px;height:22px;border-radius:50%;background:#ff5a45"></div>
    <div style="font-family:'Noto Serif',serif;font-weight:700;font-size:34px;letter-spacing:4px;color:#ffd9d2">ON AIR</div>
  </div>

  <div id="panel" style="left:60px;top:836px;width:1800px;height:196px">
    <div id="capbox" class="abs" style="left:76px;top:16px;right:76px;bottom:44px"></div>
    <div id="eq" style="left:130px;right:130px;bottom:12px;height:26px"></div>
  </div>
</div>
<script>
(function () {
  var C = window.Core;
  var S = { arabic: 130, icon: 84, label: 54, iconC: 70, labelC: 46, cardMin: 600, cardMax: 840, padV: 20, padH: 40, radius: 32, gap: 20,
            num: 150, num2: 118, numLabel: 50, btn: 48, badgeW: 580, tap: 110, appName: 40, closeIcon: 62 };
  var E = {}, logoH = 0;
  function buildStudio() {
    var g = '', r, c, i;
    for (r = 0; r < 2; r++) for (c = 0; c < 4; c++) {
      var x = 1000 + c * 229, y = 150 + r * 290;
      g += '<rect x="' + x + '" y="' + y + '" width="209" height="270" rx="14" fill="#0b3f24" stroke="#c9973a" stroke-opacity=".55" stroke-width="2"/>';
      for (i = 1; i < 8; i++) g += '<path d="M' + (x + i * 26) + ' ' + (y + 14) + 'V' + (y + 256) + '" stroke="#04210f" stroke-opacity=".55" stroke-width="4"/>';
    }
    var cols = ['#14804a', '#c9973a', '#0a4a2a', '#e9c46a', '#7a3b30', '#1d6b52'];
    for (i = 0; i < 18; i++) {
      var bw = 18 + ((i * 7) % 4) * 2, bh = 62 + ((i * 37) % 5) * 7, bx = 380 + i * 24;
      g += '<rect x="' + bx + '" y="' + (230 - bh) + '" width="' + bw + '" height="' + bh + '" rx="2" fill="' + cols[i % 6] + '" stroke="#04210f" stroke-opacity=".5" stroke-width="2"/><path d="M' + bx + ' ' + (230 - bh + 12) + 'H' + (bx + bw) + 'M' + bx + ' ' + (222) + 'H' + (bx + bw) + '" stroke="#f6dc8e" stroke-opacity=".8" stroke-width="2"/>';
    }
    g += '<rect x="368" y="230" width="474" height="13" rx="3" fill="#8a5a2b" stroke="#c9973a" stroke-width="2"/>';
    for (i = 0; i < 7; i++) { var a = -66 + i * 22, L = 62 + (i % 3) * 14; g += '<ellipse cx="1846" cy="' + (734 - L) + '" rx="14" ry="' + L + '" transform="rotate(' + a + ' 1846 734)" fill="#14804a" stroke="#0a4a2a" stroke-width="3"/>'; }
    g += '<polygon points="1812,728 1880,728 1868,806 1824,806" fill="#c9973a" stroke="#8a6620" stroke-width="3"/>';
    document.getElementById('studio').innerHTML = g;
  }
  function pulse(t, p) { var ph = ((t % p) + p) % p; return ph < 0.16 ? Math.sin(Math.PI * ph / 0.16) : 0; }
  C.run({
    W: 1920, H: 1080, S: S, px: 211, closingBottom: 36,
    bg: 'radial-gradient(90% 90% at 70% 35%, #0a4a2a 0%, #04210f 60%, #021208 100%)',
    glow: 'radial-gradient(50% 50% at 75% 40%, rgba(20,128,74,.45), transparent 70%)',
    star: { cx: 1450, cy: 380, size: 1700, op: 0.10 },
    progress: 'left:60px;right:60px;bottom:22px;height:8px',
    panelR: 48, eq: { n: 40, base: 4, range: 22 }, brandIcon: 0,
    capStart: function (n) { return n <= 50 ? 64 : 56; }, capMin: 34,
    panelOrn: function (pin, Core) {
      var l = document.createElement('div'), r = document.createElement('div');
      l.style.cssText = 'position:absolute;left:22px;top:50%;margin-top:-20px'; r.style.cssText = 'position:absolute;right:22px;top:50%;margin-top:-20px';
      l.innerHTML = Core.icon('star4', 40); r.innerHTML = Core.icon('star4', 40); pin.appendChild(l); pin.appendChild(r);
    },
    onInit: function (st, els) {
      buildStudio(); E.logo = els.logo; E.lring = document.getElementById('lring'); E.lcard = document.getElementById('lcard');
      ['htorso', 'hhead', 'hmouth', 'lidL', 'lidR', 'hpupils', 'hbrows', 'armR', 'screen', 'onair', 'oadot'].forEach(function (k) { E[k] = document.getElementById(k); });
      var im = els.logo.querySelector('img'); function m() { logoH = els.logo.offsetHeight; } im.addEventListener('load', m); m();
      window.__logoMeasure = m;
    },
    onSeek: function (t, x) {
      var st = x.st, lv = x.lv, sp = x.sp, m = x.mouth;
      if (!logoH) logoH = E.logo.offsetHeight || 430;
      var bs = st.brand ? st.brand.start : 0, shrinkAt = st.brand ? st.brand.end - 0.4 : 5.6, lastAt = st.last ? st.last.start : 1e9;
      var intro = C.easeBack(C.prog(t, bs, 0.9)), op = t >= bs ? C.easeOut(C.prog(t, bs, 0.5)) : 0;
      var f1 = C.easeInOut(C.prog(t, shrinkAt, 0.7)), f2 = C.easeInOut(C.prog(t, lastAt, 0.8));
      var cx = C.lerp(C.lerp(550, 210, f1), 550, f2), cy = C.lerp(C.lerp(535, 145, f1), 460, f2), base = C.lerp(C.lerp(1, 0.5, f1), 0.78, f2);
      var sc = base * (0.2 + 0.8 * intro) * (1 + 0.016 * lv + 0.006 * Math.sin(2.2 * t));
      E.logo.style.opacity = op; E.logo.style.transform = 'translate(' + (cx - 260).toFixed(2) + 'px,' + (cy - logoH / 2).toFixed(2) + 'px) scale(' + sc.toFixed(4) + ')';
      E.lcard.style.boxShadow = '0 0 ' + (30 + 90 * lv).toFixed(1) + 'px rgba(233,196,106,' + (0.35 + 0.3 * lv).toFixed(3) + ')';
      var rp = C.prog(t, bs + 0.6, 1.4); E.lring.style.opacity = rp > 0 && rp < 1 ? 0.8 * (1 - rp) : 0; E.lring.style.transform = 'scale(' + (1 + 0.45 * C.easeOut(rp)) + ')';
      E.screen.style.boxShadow = '0 0 ' + (24 + 60 * lv).toFixed(1) + 'px ' + x.rgba([233, 196, 106], 0.2 + 0.35 * lv) + ', inset 0 0 ' + (30 + 50 * lv).toFixed(1) + 'px ' + x.rgba([20, 128, 74], 0.35);
      E.onair.style.boxShadow = '0 0 ' + (8 + 40 * lv * sp).toFixed(1) + 'px ' + x.rgba([255, 90, 69], 0.25 + 0.5 * sp * lv);
      E.oadot.style.opacity = (0.35 + 0.65 * sp * (0.5 + 0.5 * Math.sin(5 * t))).toFixed(3);
      /* host */
      var mm = Math.min(1, m) * (0.75 + 0.25 * lv);
      E.hmouth.setAttribute('transform', 'translate(460 334) scale(' + (1 + 0.18 * mm).toFixed(3) + ' ' + (0.10 + 0.90 * mm).toFixed(3) + ') translate(-460 -334)');
      var blink = Math.max(pulse(t, 3.4), pulse(t + 1.1, 5.3));
      E.lidL.setAttribute('transform', 'translate(420 228) scale(1 ' + blink.toFixed(3) + ') translate(-420 -228)');
      E.lidR.setAttribute('transform', 'translate(500 228) scale(1 ' + blink.toFixed(3) + ') translate(-500 -228)');
      E.hhead.setAttribute('transform', 'translate(0 ' + (Math.sin(1.7 * t) * 1.5 - 3.5 * mm).toFixed(2) + ') rotate(' + (Math.sin(0.8 * t) * 1.4 + sp * Math.sin(2.3 * t) * 0.9).toFixed(3) + ' 460 350)');
      E.htorso.setAttribute('transform', 'translate(0 ' + (Math.sin(1.6 * t) * 2.2 + 3 * lv * sp).toFixed(2) + ')');
      E.hbrows.setAttribute('transform', 'translate(0 ' + (-(2 + 6 * lv * sp + 2 * mm)).toFixed(2) + ')');
      E.hpupils.setAttribute('transform', 'translate(' + (Math.sin(0.5 * t) * 2).toFixed(2) + ' ' + (Math.sin(0.37 * t) * 1).toFixed(2) + ')');
      var wave = 0.5 + 0.5 * Math.sin(1.1 * t);
      E.armR.setAttribute('transform', 'rotate(' + (-(5 + 36 * sp * (0.35 + 0.65 * wave * (0.5 + 0.5 * lv)))).toFixed(2) + ' 590 450)');
    }
  });
})();
</script>
</body>
</html>
