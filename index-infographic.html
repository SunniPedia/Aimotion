<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Infographic - Islamic Encyclopedia</title>
<style>
@font-face{font-family:'SolaimanLipi';src:url('assets/fonts/SolaimanLipi-Regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:'SolaimanLipi';src:url('assets/fonts/SolaimanLipi-Bold.ttf') format('truetype');font-weight:700;font-display:block}
:root{--deep1:#04210f;--deep2:#0a4a2a;--accent:#14804a;--gold1:#e9c46a;--gold2:#c9973a;--cream:#fff8e6;--ang:0deg}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#021208}
body{font-family:'Noto Serif','SolaimanLipi','Noto Serif Bengali','Noto Sans Bengali',serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;isolation:isolate;background: radial-gradient(120% 80% at 50% 30%, #0f6b3a 0%, #0a4a2a 45%, #021208 100%)}
#bgGlow{position:absolute;left:-20%;top:-5%;width:140%;height:90%;border-radius:50%;background:radial-gradient(60% 60% at 50% 40%, rgba(233,196,106,0.18), transparent 70%);opacity:0.72;pointer-events:none}
#stars{position:absolute;left:50%;top:40%;width:2200px;height:2200px;transform:translate(-50%,-50%);opacity:0.13;pointer-events:none}
#particles{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.pdot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold1);box-shadow:0 0 8px var(--gold1)}
#logoCard{position:absolute;left:50%;top:190px;width:520px;height:520px;transform:translateX(-50%);z-index:5;transform-origin:top center}
#logoCardInner{width:520px;height:520px;border-radius:56px;background:#fff;border:6px solid var(--gold1);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,0,0,0.4), 0 0 30px rgba(233,196,106,0.3)}
#logoCardInner img{width:92%;height:92%;object-fit:contain}
#logoRipple{position:absolute;left:50%;top:50%;width:520px;height:520px;border-radius:56px;border:3px solid var(--gold1);transform:translate(-50%,-50%);opacity:0;pointer-events:none}
#visualArea{position:absolute;left:60px;right:60px;top:470px;height:740px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screenGlow{position:absolute;left:-20%;top:-20%;width:140%;height:140%;border-radius:50%;pointer-events:none;opacity:0.5}
.visual-wrap{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;opacity:0}
.arabic-greeting{font-family:'Noto Naskh Arabic',serif;font-size:170px;color:var(--gold1);text-shadow:0 0 30px rgba(233,196,106,0.8),0 0 60px rgba(233,196,106,0.4);line-height:1}
.card-row{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;align-items:center}
.card{min-width:700px;max-width:940px;padding:34px 50px;border-radius:40px;background:linear-gradient(180deg, rgba(255,248,230,0.14), rgba(255,248,230,0.06));border:1px solid rgba(233,196,106,0.3);display:flex;align-items:center;gap:18px;box-shadow:0 10px 30px rgba(0,0,0,0.3);backdrop-filter:blur(6px);opacity:0;transform:translateX(80px)}
.card.compact{min-width:500px;max-width:700px;padding:24px 36px}
.card-icon{font-size:110px;line-height:1}
.card.compact .card-icon{font-size:90px}
.card-label{font-family:'SolaimanLipi';font-size:62px;font-weight:700;color:var(--cream);line-height:1.2}
.card.compact .card-label{font-size:54px}
.counter-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.counter-num{font-family:'SolaimanLipi';font-size:210px;font-weight:800;color:var(--gold1);line-height:0.9;text-shadow:0 0 20px rgba(233,196,106,0.6)}
.counter-num.small{font-size:160px}
.counter-label{font-family:'SolaimanLipi';font-size:62px;color:var(--cream)}
.badge-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;position:relative}
.badge-img{width:780px;height:auto;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.5);display:block}
.tap-ring{position:absolute;left:72%;top:58%;width:150px;height:150px;border-radius:50%;border:3px solid var(--gold1);opacity:0;pointer-events:none}
.app-name-under{font-family:'SolaimanLipi';font-size:54px;color:var(--cream);text-align:center}
.neutral-btn{display:flex;align-items:center;gap:16px;padding:22px 40px;border-radius:18px;background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#04210f;font-family:'SolaimanLipi';font-size:70px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,0.4)}
.closing-emoji-row{display:flex;gap:28px;justify-content:center;align-items:center;font-size:120px}
#captionPanel{position:absolute;left:50px;right:50px;top:1230px;height:540px;border-radius:64px;z-index:6;isolation:isolate;background:radial-gradient(120% 120% at 30% 10%, rgba(255,248,230,0.12), rgba(4,33,15,0.92) 60%);border:2px solid transparent;background-clip:padding-box;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
#captionPanel::before{content:'';position:absolute;inset:-2px;border-radius:64px;padding:2px;background:conic-gradient(from var(--ang), var(--gold1), var(--gold2), var(--gold1), #fff8e6, var(--gold1)); -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none}
#captionOrn{position:absolute;left:0;right:0;top:18px;text-align:center;font-size:34px;letter-spacing:14px;color:var(--gold1);opacity:0.8}
#captionBox{position:absolute;left:56px;right:56px;top:74px;bottom:96px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
#captionText{width:100%;font-family:'SolaimanLipi','Noto Serif Bengali',serif;font-weight:700;line-height:1.42;letter-spacing:0.2px;color:var(--cream);text-shadow:0 2px 10px rgba(0,0,0,0.6)}
.word{display:inline-block;white-space:nowrap;margin-right:0.28em;opacity:0;transform:translateY(26px)}
.word.gold{color:var(--gold1)!important}
.word.active{color:var(--gold1);text-shadow:0 0 34px rgba(233,196,106,0.9),0 0 12px rgba(233,196,106,0.6)}
#equalizer{position:absolute;left:90px;right:90px;bottom:30px;height:48px;display:flex;align-items:flex-end;gap:4px;opacity:0.9}
.eq-bar{flex:1;background:linear-gradient(180deg,var(--gold1),var(--gold2));border-radius:3px 3px 0 0;min-height:6px}
#progress{position:absolute;left:70px;right:70px;bottom:90px;height:12px;border-radius:6px;background:rgba(255,248,230,0.15);overflow:hidden;z-index:10}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold2),var(--gold1));border-radius:6px}
#vignette{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 50%, transparent 65%, rgba(0,0,0,0.45) 100%);pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="stage">
<div id="bgGlow"></div>
<svg id="stars" viewBox="0 0 200 200"><defs><g id="starShape"><rect x="-14" y="-14" width="28" height="28" fill="none" stroke="#e9c46a" stroke-width="0.35" transform="rotate(45)"/><circle cx="0" cy="0" r="3" fill="none" stroke="#e9c46a" stroke-width="0.25"/><circle cx="0" cy="0" r="7" fill="none" stroke="#e9c46a" stroke-width="0.22"/><circle cx="0" cy="0" r="11" fill="none" stroke="#e9c46a" stroke-width="0.18"/></g></defs><g id="starGrid"></g></svg>
<div id="particles"></div>
<div id="logoCard"><div id="logoCardInner"><img id="logoImg" src="assets/logo.png" alt="logo"></div><div id="logoRipple"></div></div>
<div id="visualArea"><div id="screenGlow"></div><div id="screenContent" style="position:absolute;left:0;top:0;width:100%;height:100%"></div></div>
<div id="captionPanel"><div id="captionOrn">✦ ❖ ✦</div><div id="captionBox"><div id="captionText"></div></div><div id="equalizer"></div></div>
<div id="progress"><div id="progressFill"></div></div>
<div id="vignette"></div>
</div>
<script>
const MOOD_COLORS={respectful:[233,196,106],happy:[255,190,90],informative:[60,200,170],excited:[170,230,80],calm:[110,170,255],enthusiastic:[255,160,70]};
function easeOut(x){return 1-Math.pow(1-x,3)}
function easeInOut(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function easeBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function prog(t,s,d){return clamp((t-s)/d,0,1)}
let scenes=[], totalDuration=0, audioEnvelope=null, audioFps=30, optsGlobal={}, brandSceneEnd=5.6, lastSceneStart=0, currentScene=null;
function parseTimestamps(txt){
  const lines=txt.split('\n').filter(l=>l.trim().length>0);
  const out=[];
  for(let i=0;i<lines.length;i++){
    const parts=lines[i].split('|'); if(parts.length<3) continue;
    let s=parseFloat(parts[0].trim()); let e=parseFloat(parts[1].trim());
    let text=parts[2].trim(); let mood=(parts[3]||'happy').trim().toLowerCase();
    if(!(mood in MOOD_COLORS)) mood='happy';
    let golds=[]; const regex=/\u275D(.*?)\u275E/g; let m; while((m=regex.exec(text))!==null){golds.push(m[1]);}
    let display=text.replace(/\u275D/g,'').replace(/\u275E/g,'');
    out.push({start:s,end:e,text:display,raw:text,golds,mood,idx:out.length});
  }
  out.sort((a,b)=>a.start-b.start);
  for(let i=0;i<out.length-1;i++){ if(out[i].end>out[i+1].start){ out[i].end=out[i+1].start; } }
  return out;
}
function extractNumbers(txt){
  const nums=[];
  if(/\u09AA\u0981\u09AF\u09BC\u09A4\u09BE\u09B2\u09CD\u09B2\u09BF\u09B6/.test(txt)) nums.push({spoken:'পঁয়তাল্লিশটি',value:45,plus:false});
  if(/\u09A6\u09C1\u0987 \u09B2\u0995\u09CD\u09B7 \u09B8\u09A4\u09CD\u09A4\u09B0 \u09B9\u09BE\u099C\u09BE\u09B0 \u09A4\u09BF\u09A8\u09B6\u09CB \u09AA\u0981\u09AF\u09BC\u09A4\u09CD\u09B0\u09BF\u09B6/.test(txt)) nums.push({spoken:'দুই লক্ষ সত্তর হাজার তিনশো পঁয়ত্রিশটি',value:270335,plus:false});
  if(/\u09A6\u09C1\u099F\u09BF/.test(txt)) nums.push({spoken:'দুটি',value:2,plus:false});
  if(/\u0986\u099F\u099F\u09BF/.test(txt) && !/\u0986\u099F\u09B6\u09A4/.test(txt)) nums.push({spoken:'আটটি',value:8,plus:false});
  if(/\u0986\u099F\u09B6\u09A4/.test(txt)) nums.push({spoken:'আটশত',value:800,plus:true});
  if(/\u098F\u0995 \u09B9\u09BE\u099C\u09BE\u09B0/.test(txt)) nums.push({spoken:'এক হাজারের বেশি',value:1000,plus:true});
  return nums;
}
function buildVisualConfig(sc, isLast){
  const txt=sc.text;
  if(/\u0986\u09B8\u09B8\u09BE\u09B2\u09BE\u09AE\u09C1 \u0986\u09B2\u09BE\u0987\u0995\u09C1\u09AE/.test(txt)) return {type:'greeting',numbers:[]};
  if(sc.golds.length>0 || /\u0987\u09B8\u09B2\u09BE\u09AE\u09C0 \u09AC\u09BF\u09B6\u09CD\u09AC\u0995\u09CB\u09B7/.test(txt)) return {type:'brand',numbers:extractNumbers(txt)};
  if(/\u09AA\u09CD\u09B2\u09C7 \u09B8\u09CD\u099F\u09CB\u09B0/.test(txt)) return {type:'badge',numbers:[]};
  if(isLast) return {type:'closing',numbers:[]};
  const nums=extractNumbers(txt);
  if(/,/.test(txt) || nums.length>0) return {type:'cards',numbers:nums};
  return {type:'card',numbers:nums};
}
function makeEmojiForLabel(label){
  if(/\u0995\u09C1\u09B0\u0986\u09A8|\u09A4\u09BE\u09AB\u09B8\u09C0\u09B0/.test(label)) return '\uD83D\uDCD6';
  if(/\u09B9\u09BE\u09A6\u09BF\u09B8/.test(label)) return '\uD83D\uDCDA';
  if(/\u0995\u09BF\u09A4\u09BE\u09AC|\u09AC\u0987/.test(label)) return '\uD83D\uDCDA';
  if(/\u09A8\u09BE\u09AE\u09BE\u099C|\u09AE\u09B8\u099C\u09BF\u09A6/.test(label)) return '\uD83D\uDD4C';
  if(/\u09B8\u09C7\u09B9\u09B0\u09BF|\u0987\u09AB\u09A4\u09BE\u09B0/.test(label)) return '\uD83C\uDF19';
  if(/\u0995\u09BF\u09AC\u09B2\u09BE/.test(label)) return '\uD83E\uDDED';
  if(/\u09A4\u09BE\u09B8\u09AC\u09BF\u09B9/.test(label)) return '\uD83D\uDCFF';
  if(/\u09AC\u09AF\u09BC\u09BE\u09A8/.test(label)) return '\uD83C\uDF99\uFE0F';
  if(/\u09A8\u09BE\u09A4/.test(label)) return '\uD83C\uDFB5';
  if(/\u09A6\u09CB\u09AF\u09BC\u09BE/.test(label)) return '\uD83E\uDD32';
  return '\u2726';
}
function createCard(label, compact){
  const div=document.createElement('div'); div.className='card'+(compact?' compact':'');
  const icon=document.createElement('div'); icon.className='card-icon'; icon.textContent=makeEmojiForLabel(label);
  const lab=document.createElement('div'); lab.className='card-label'; lab.textContent=label.trim();
  div.appendChild(icon); div.appendChild(lab); return div;
}
function txtSplitLabels(txt){
  let parts=txt.split(/[,،।]/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1) parts=txt.split(/ \u098F\u09AC\u0982\u0982 | \u0993 /).map(s=>s.trim()).filter(Boolean);
  return parts.filter(p=>p.length>0 && p.length<40);
}
function initStars(){const g=document.getElementById('starGrid');let html='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){const x=10+c*25+(r%2)*12;const y=10+r*28;const s=0.6+((c+r)%3)*0.2;html+=`<use href="#starShape" x="${x}" y="${y}" transform="scale(${s})"/>`;}g.innerHTML=html;}
function initParticles(){const cont=document.getElementById('particles');cont.innerHTML='';for(let i=0;i<38;i++){const d=document.createElement('div');d.className='pdot';d.dataset.i=i;cont.appendChild(d);}}
function initEqualizer(n){const eq=document.getElementById('equalizer');eq.innerHTML='';for(let i=0;i<n;i++){const b=document.createElement('div');b.className='eq-bar';eq.appendChild(b);}}
function buildDOM(){
  const screenContent=document.getElementById('screenContent'); screenContent.innerHTML='';
  const captionText=document.getElementById('captionText'); captionText.innerHTML='';
  scenes.forEach((sc,si)=>{
    const cfg=buildVisualConfig(sc, si===scenes.length-1); sc.cfg=cfg;
    const wrap=document.createElement('div'); wrap.className='visual-wrap'; wrap.dataset.idx=si; wrap.style.opacity='0';
    if(cfg.type==='greeting'){const ar=document.createElement('div');ar.className='arabic-greeting';ar.textContent='\u0627\u0644\u0633\u0644\u0627\u0645 \u0639\u0644\u064A\u0643\u0645';wrap.appendChild(ar);}
    else if(cfg.type==='brand'){const badge=document.createElement('div');badge.style.fontSize='64px';badge.style.color='#e9c46a';badge.style.fontFamily='SolaimanLipi';badge.textContent='\u2726 \u0987\u09B8\u09B2\u09BE\u09AE\u09C0 \u09AC\u09BF\u09B6\u09CD\u09AC\u0995\u09CB\u09B7 \u2726';wrap.appendChild(badge);}
    else if(cfg.type==='badge'){
      const bw=document.createElement('div'); bw.className='badge-wrap';
      const img=document.createElement('img'); img.className='badge-img'; img.id='badgeImg'+si;
      if(optsGlobal.badge){img.src=optsGlobal.badge;} else {img.style.display='none';const neut=document.createElement('div');neut.className='neutral-btn';neut.innerHTML='<span>\u25B6</span><span>\u0987\u09A8\u09B8\u09CD\u099F\u09B2 \u0995\u09B0\u09C1\u09A8</span>';bw.appendChild(neut);}
      bw.appendChild(img); const ring=document.createElement('div');ring.className='tap-ring';ring.id='tapRing'+si;bw.appendChild(ring);
      const appName=document.createElement('div');appName.className='app-name-under';appName.textContent='\u0987\u09B8\u09B2\u09BE\u09AE\u09C0 \u09AC\u09BF\u09B6\u09CD\u09AC\u0995\u09CB\u09B7 \u0993 \u0986\u09B2 \u09B9\u09BE\u09A6\u09BF\u09B8 S2';bw.appendChild(appName);wrap.appendChild(bw);
    } else if(cfg.type==='closing'){const row=document.createElement('div');row.className='closing-emoji-row';row.innerHTML='<span>\uD83E\uDD32</span><span>\uD83D\uDCD6</span><span>\uD83D\uDD4C</span>';wrap.appendChild(row);}
    else {
      const labels=txtSplitLabels(sc.text); const compact=labels.length>=3; const row=document.createElement('div');row.className='card-row';
      labels.slice(0,3).forEach((lab,j)=>{const card=createCard(lab,compact);card.dataset.j=j;row.appendChild(card);});
      wrap.appendChild(row);
      cfg.numbers.forEach(n=>{const cw=document.createElement('div');cw.className='counter-wrap';const numEl=document.createElement('div');numEl.className='counter-num';numEl.dataset.value=n.value;numEl.dataset.plus=n.plus?'1':'0';numEl.textContent='0';const lab=document.createElement('div');lab.className='counter-label';lab.textContent=n.spoken;cw.appendChild(numEl);cw.appendChild(lab);wrap.appendChild(cw);});
    }
    document.getElementById('visualArea').appendChild(wrap);
    const words=sc.text.split(/\\s+/).filter(Boolean); const totalChars=words.reduce((a,w)=>a+w.length+1,0); let cum=0;
    const wordBox=document.createElement('div');wordBox.dataset.idx=si;wordBox.style.display='contents';
    words.forEach((w,wi)=>{const span=document.createElement('span');span.className='word';if(sc.cfg.type==='brand'||sc.cfg.type==='badge') span.classList.add('gold');span.textContent=w;span.dataset.si=si;span.dataset.wi=wi;const weight=w.length+1;const startF=0.15+(cum/totalChars)*Math.max(0.6, sc.end-sc.start-0.55);span.dataset.st=startF;span.dataset.en=startF+0.4;cum+=weight;wordBox.appendChild(span);});
    captionText.appendChild(wordBox);
  });
}
window.init=function(raw, opts){
  optsGlobal=opts||{}; initStars(); initParticles(); initEqualizer(30);
  scenes=parseTimestamps(raw); totalDuration=scenes[scenes.length-1].end+0.5;
  buildDOM();
  const brand=scenes.find(s=>s.cfg.type==='brand'); if(brand) brandSceneEnd=brand.end; else brandSceneEnd=5.6;
  lastSceneStart=scenes[scenes.length-1].start;
  window.seek(0); return totalDuration;
};
window.fit=function(){
  const box=document.getElementById('captionBox'); const txt=document.getElementById('captionText');
  let size=parseFloat(getComputedStyle(txt).fontSize);
  const len=(txt.textContent||'').length;
  if(len<=40) size=72; else if(len<=90) size=66; else if(len<=130) size=56; else size=50;
  txt.style.fontSize=size+'px';
  for(let iter=0;iter<30;iter++){const h=txt.scrollHeight;const maxH=box.clientHeight;if(h<=maxH) break; size-=2; if(size<40){size=40;break;} txt.style.fontSize=size+'px';}
  return {captionSize:size};
};
window.setAudio=function(env,fps){audioEnvelope=env; audioFps=fps||30;};
function level(t){
  if(audioEnvelope && audioEnvelope.length>0){const idx=Math.floor(t*audioFps)%audioEnvelope.length; return audioEnvelope[idx];}
  return Math.max(0,Math.min(1,0.38+0.20*Math.sin(3.1*t)+0.12*Math.sin(7.7*t+1)));
}
window.seek=function(t){
  const lv=level(t);
  document.getElementById('progressFill').style.width=(clamp(t/totalDuration,0,1)*100)+'%';
  document.getElementById('bgGlow').style.opacity=(0.72+0.28*lv).toFixed(3);
  const stars=document.getElementById('stars'); if(stars){stars.style.transform=`translate(-50%,-50%) rotate(${(t*2.2)%360}deg)`; stars.style.opacity=(0.10+0.07*lv).toFixed(3);}
  document.querySelectorAll('.pdot').forEach(el=>{const i=parseInt(el.dataset.i,10);const x=(i*97 + Math.sin(0.4*t + i)*40)%1080;const y=1920 - ((t*(20 + (i%7)*9) + i*131)%1980);el.style.left=x+'px';el.style.top=y+'px';el.style.opacity=(0.15+0.2*lv+0.15*Math.abs(Math.sin(t+i))).toFixed(3);});
  document.querySelectorAll('.eq-bar').forEach((bar,i)=>{const wave=0.5+0.5*Math.abs(Math.sin(6*t+0.7*i));const shape=0.65+0.35*Math.sin(0.45*i+1);const h=6+40*clamp(lv*1.15*wave*shape+0.04,0,1);bar.style.height=h+'px';const col=MOOD_COLORS[(currentScene&&currentScene.mood)||'happy'];bar.style.background=`rgb(${col[0]},${col[1]},${col[2]})`;});
  document.getElementById('captionPanel').style.setProperty('--ang',(t*90)+'deg');
  const moodCol=MOOD_COLORS[(currentScene&&currentScene.mood)||'happy'];
  document.getElementById('captionPanel').style.boxShadow=`0 20px 60px rgba(0,0,0,0.5), 0 0 ${24+80*lv}px rgba(${moodCol[0]},${moodCol[1]},${moodCol[2]},${0.22+0.45*lv})`;
  let active=null; for(const sc of scenes){if(t>=sc.start-0.01 && t<=sc.end+0.01){active=sc;break;}} currentScene=active;
  // logo
  const logoCard=document.getElementById('logoCard'); const ripple=document.getElementById('logoRipple');
  if(logoCard){
    const brandStart=scenes.find(s=>s.cfg.type==='brand')?.start ?? 0;
    if(t<brandStart-0.01){logoCard.style.opacity='0'; logoCard.style.transform='translateX(-50%) scale(0.2)';}
    else if(t<brandStart+0.9){const p=prog(t,brandStart,0.9);const scv=0.2+0.8*easeBack(p);logoCard.style.opacity=easeOut(p);logoCard.style.transform=`translateX(-50%) scale(${scv})`; if(ripple){const rp=prog(t,brandStart+0.6,1.4);ripple.style.opacity=(easeOut(1-rp)*0.6).toFixed(2);ripple.style.transform=`translate(-50%,-50%) scale(${1+rp*0.6})`;}}
    else if(t<brandSceneEnd+0.3){
      // stay full
      logoCard.style.opacity='1'; logoCard.style.transform=`translateX(-50%) scale(${1+0.016*lv*Math.sin(t*2.5)})`; if(ripple) ripple.style.opacity='0';
    } else if(t<brandSceneEnd+1.0){
      const p=prog(t,brandSceneEnd-0.4,0.7); const sy= (p* -120); const scv=1+(0.62-1)*p; logoCard.style.transform=`translateX(-50%) translateY(${sy}px) scale(${scv})`; logoCard.style.opacity='1';
    } else if(t<lastSceneStart-0.01){
      logoCard.style.opacity='1'; logoCard.style.transform=`translateX(-50%) translateY(-120px) scale(0.62)`;
    } else {
      if(t<lastSceneStart+0.8){const p=prog(t,lastSceneStart,0.8); const sy=-120*(1-p); const scv=0.62+(1-0.62)*easeBack(p); logoCard.style.transform=`translateX(-50%) translateY(${sy}px) scale(${scv})`; logoCard.style.opacity=easeOut(p);}
      else {logoCard.style.transform=`translateX(-50%) scale(${1+0.016*lv*Math.sin(t*2.5)})`; logoCard.style.opacity='1';}
    }
    document.getElementById('logoCardInner').style.boxShadow=`0 20px 60px rgba(0,0,0,0.4), 0 0 ${30+90*lv}px rgba(233,196,106,0.3)`;
  }
  // visuals
  scenes.forEach(sc=>{
    const wraps=document.querySelectorAll('.visual-wrap'); const wrap=wraps[sc.idx]; if(!wrap) return;
    const isActive=active&&active.idx===sc.idx; const isLast=sc.idx===scenes.length-1;
    let vis=0; if(isActive){const enter=prog(t,sc.start,0.45);const exit=isLast?1:1-prog(t,sc.end-0.3,0.3);vis=easeOut(enter)*easeOut(exit);}
    wrap.style.opacity=vis;
    if(isActive){const enter=prog(t,sc.start,0.45);const ty=(1-easeOut(enter))*40;wrap.style.transform=`translateY(${ty}px)`;}
    const glowCol=MOOD_COLORS[sc.mood]; wrap.style.background=`radial-gradient(60% 60% at 50% 40%, rgba(${glowCol[0]},${glowCol[1]},${glowCol[2]},${0.18*vis}), transparent 70%)`;
    wrap.querySelectorAll('.card').forEach(card=>{const j=parseInt(card.dataset.j||'0',10);const stagger=sc.start+0.6+j*0.18;if(t>=stagger-0.01){const p=prog(t,stagger,0.6);const e=easeBack(p);card.style.opacity=e;card.style.transform=`translateX(${(1-e)*80}px) scale(${0.85+0.15*e})`;}else{card.style.opacity='0';card.style.transform='translateX(80px) scale(0.85)';}});
    wrap.querySelectorAll('.counter-num').forEach(cnt=>{const val=parseInt(cnt.dataset.value,10);const startC=sc.start+0.4;if(t>=startC){const p=prog(t,startC,Math.min(3.2,Math.max(1.4,val>100000?3.0:1.6)));const cur=Math.floor(val*easeOut(p));cnt.textContent=cur.toLocaleString('bn-BD')+(cnt.dataset.plus==='1'&&p>0.95?'+':'');}else cnt.textContent='0';});
    const badgeImg=wrap.querySelector('.badge-img'); if(badgeImg&&isActive){const p=prog(t,sc.start+0.4,0.6);const scv=0.4+0.6*easeBack(p);const fl=Math.sin(t*2.2)*3*vis;badgeImg.style.opacity=easeOut(p);badgeImg.style.transform=`scale(${scv}) translateY(${fl}px)`;}
    const tapRing=wrap.querySelector('.tap-ring'); if(tapRing&&isActive){if(t>=sc.start+2.0){const cycle=(t-(sc.start+2.0))%1.3;const p=cycle/1.3;tapRing.style.opacity=String((1-p)*0.7*vis);tapRing.style.transform=`translate(-50%,-50%) scale(${1+p*0.9})`;}else tapRing.style.opacity='0';}
  });
  // caption words
  document.querySelectorAll('.word').forEach(w=>{
    const si=parseInt(w.dataset.si,10); const sc=scenes[si]; if(!sc) return;
    const isActive=active&&active.idx===si;
    if(!isActive){w.style.opacity='0';w.style.transform='translateY(26px)';return;}
    const lt=t-sc.start; const st=parseFloat(w.dataset.st); const en=parseFloat(w.dataset.en);
    if(lt>=st){const p=prog(lt,st,0.3);w.style.opacity=easeOut(p);w.style.transform=`translateY(${(1-easeOut(p))*26}px)`;} else {w.style.opacity='0';w.style.transform='translateY(26px)';}
    const aProgS=prog(lt,st,0.12); const aProgE=prog(lt,en-0.05,0.14); const a=easeOut(aProgS)*(1-easeOut(aProgE));
    if(a>0.01){w.classList.add('active');w.style.transform=`translateY(${-6*a}px) scale(${1+0.07*a})`;} else w.classList.remove('active');
  });
};
</script>
</body>
</html>
