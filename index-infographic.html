<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><title>Infographic</title>
<style>
@font-face{font-family:'SolaimanLipi';src:url('assets/fonts/SolaimanLipi-Regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:'SolaimanLipi';src:url('assets/fonts/SolaimanLipi-Bold.ttf') format('truetype');font-weight:700;font-display:block}
:root{--g1:#04210f;--g2:#0a4a2a;--g3:#14804a;--gold:#e9c46a;--gold2:#c9973a;--cream:#fff8e6}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#021208;overflow:hidden}
body{font-family:'Noto Serif','SolaimanLipi','Noto Serif Bengali','Noto Sans Bengali',serif;color:var(--cream)}
#stage{position:relative;overflow:hidden;background:#021208}
#stage>*{position:absolute}
.ln{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:url(#gg);stroke:none}
.ic{display:block;overflow:visible}
.baseglow{inset:0}
.particles>i,.particles{position:absolute}
.particles{inset:0}
.particles>i{border-radius:50%;background:radial-gradient(circle,#fff3c4,var(--gold) 55%,transparent 72%);left:0;top:0}
.vig{inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.vglow{border-radius:50%}
.visual{overflow:hidden}
.vscene{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden;opacity:0}
.arabic{font-family:'Noto Naskh Arabic',serif;color:var(--gold);line-height:1.4;direction:rtl;white-space:nowrap}
.cardcol{display:flex;flex-direction:column;align-items:center}
.card{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(10,74,42,.92),rgba(4,33,15,.96));border:3px solid var(--gold2);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 40px rgba(233,196,106,.08)}
.clabel{color:var(--cream);font-weight:700;line-height:1.25;text-align:center}
.numbox{display:flex;flex-direction:column;align-items:center;margin-top:8px}
.numrow{display:inline-grid;font-weight:700;color:var(--gold);line-height:1.05;text-shadow:0 0 30px rgba(233,196,106,.5)}
.numrow span{grid-area:1/1;text-align:center;white-space:nowrap}
.ghost{visibility:hidden}
.numlab{color:var(--cream);font-weight:700;line-height:1.2;text-align:center}
.storecol{display:flex;flex-direction:column;align-items:center}
.badge{position:relative}
.badge img{display:block;width:100%;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.btn{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f6dc8f,#c9973a);color:var(--g1);font-weight:700;border-radius:999px;box-shadow:0 14px 28px rgba(0,0,0,.5);white-space:nowrap}
.tap{position:absolute;border-radius:50%;border:6px solid var(--cream);opacity:0}
.appname{margin-top:26px;color:var(--gold);font-weight:700;text-align:center;line-height:1.3;text-shadow:0 0 24px rgba(233,196,106,.45)}
.closerow{display:flex;align-items:center;justify-content:center}
.logo{opacity:0}
.logobox{position:relative;background:#fff;overflow:hidden;border-radius:56px}
.logobox img{display:block;width:100%}
.ring{position:absolute;left:-6px;right:-6px;top:-6px;bottom:-6px;border:5px solid var(--gold);border-radius:62px;opacity:0;pointer-events:none}
.panel{border:6px solid transparent;overflow:hidden;background:radial-gradient(120% 90% at 20% 0%,rgba(20,128,74,.38),transparent 60%) padding-box,radial-gradient(100% 80% at 90% 100%,rgba(233,196,106,.12),transparent 60%) padding-box,linear-gradient(#0a3a20,#05190d) padding-box,conic-gradient(from var(--ang,0deg),#e9c46a,#7a5a1c,#fff3c4,#c9973a,#e9c46a) border-box}
.dots{inset:0;position:absolute;background-image:radial-gradient(rgba(233,196,106,.20) 1.5px,transparent 2px);background-size:26px 26px;opacity:.5}
.sweep{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent)}
.capbox{position:absolute}
.cap{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;visibility:hidden;opacity:0}
.w{display:inline-block;color:var(--cream);font-weight:700;will-change:transform}
.eq{display:flex;align-items:flex-end;justify-content:space-between}
.eq>i{flex:1;margin:0 3px;border-radius:4px;background:linear-gradient(0deg,#c9973a,#fff0b8)}
.orn{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center}
#prog{background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
#progfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9973a,#fff0b8,#e9c46a)}
html,body{width:1080px;height:1920px}
#stage{width:1080px;height:1920px}
.bg{inset:0;background:radial-gradient(120% 80% at 50% 30%,#0a4a2a,#04210f 60%,#021208)}
#pattern{width:2200px;height:2200px;left:-560px;top:-332px}
.visual{left:60px;right:60px;top:470px;height:740px}
.vglow{left:140px;right:140px;top:430px;height:820px}
.logo{left:280px;top:190px;width:520px;transform-origin:50% 0}
.logobox{border-radius:56px}
.panel{left:50px;right:50px;top:1230px;height:540px;border-radius:64px}
.capbox{left:56px;right:56px;top:74px;bottom:96px;line-height:1.42}
.cap{gap:4px 18px}
.orn{top:18px;gap:14px;height:34px}
.eq{left:90px;right:90px;bottom:30px;height:48px}
#prog{left:70px;right:70px;bottom:90px;height:12px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#f6dc8f"/><stop offset="1" style="stop-color:#c9973a"/></linearGradient>
<symbol id="ic-book" viewBox="0 0 100 100"><g class="ln"><path d="M50 28 C38 20 24 20 14 24 V74 C24 70 38 70 50 78 C62 70 76 70 86 74 V24 C76 20 62 20 50 28 Z"/><path d="M50 28 V78"/><path d="M24 38 C31 36 38 37 43 40 M24 50 C31 48 38 49 43 52 M57 40 C62 37 69 36 76 38 M57 52 C62 49 69 48 76 50"/></g></symbol>
<symbol id="ic-mosque" viewBox="0 0 100 100"><g class="ln"><path d="M30 82 V58 C30 40 42 34 50 22 C58 34 70 40 70 58 V82 Z"/><path d="M50 22 V9"/><path d="M14 82 V42 M24 82 V42 M14 42 L19 28 L24 42"/><path d="M76 82 V42 M86 82 V42 M76 42 L81 28 L86 42"/><path d="M43 82 V70 C43 61 57 61 57 70 V82"/><path d="M8 82 H92"/></g></symbol>
<symbol id="ic-crescent" viewBox="0 0 100 100"><path class="ln" d="M62 18 A36 36 0 1 0 82 62 A28 28 0 1 1 62 18 Z"/></symbol>
<symbol id="ic-star8" viewBox="0 0 100 100"><g class="ln"><rect x="24" y="24" width="52" height="52" rx="3"/><rect x="24" y="24" width="52" height="52" rx="3" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="9"/></g></symbol>
<symbol id="ic-clock" viewBox="0 0 100 100"><g class="ln"><circle cx="50" cy="50" r="36"/><path d="M50 27 V50 L66 60"/><path d="M50 14 V19 M86 50 H81 M50 86 V81 M14 50 H19"/></g></symbol>
<symbol id="ic-compass" viewBox="0 0 100 100"><g class="ln"><circle cx="50" cy="50" r="38"/><path d="M50 22 L61 50 L50 78 L39 50 Z"/></g><path class="fl" d="M50 22 L61 50 L39 50 Z"/></symbol>
<symbol id="ic-beads" viewBox="0 0 100 100"><g class="ln"><circle cx="78" cy="44" r="5.2"/><circle cx="74.2" cy="58" r="5.2"/><circle cx="64" cy="68.2" r="5.2"/><circle cx="36" cy="68.2" r="5.2"/><circle cx="25.8" cy="58" r="5.2"/><circle cx="22" cy="44" r="5.2"/><circle cx="25.8" cy="30" r="5.2"/><circle cx="36" cy="19.8" r="5.2"/><circle cx="50" cy="16" r="5.2"/><circle cx="64" cy="19.8" r="5.2"/><circle cx="74.2" cy="30" r="5.2"/><path d="M50 78 V86"/><path d="M45 86 H55 L56 97 H44 Z"/></g><circle class="fl" cx="50" cy="72" r="6.5"/></symbol>
<symbol id="ic-phone" viewBox="0 0 100 100"><g class="ln"><rect x="30" y="9" width="40" height="82" rx="9"/><path d="M43 19 H57"/><path d="M38 31 H62 V69 H38 Z"/></g><circle class="fl" cx="50" cy="80" r="3.5"/></symbol>
<symbol id="ic-mic" viewBox="0 0 100 100"><g class="ln"><rect x="37" y="10" width="26" height="46" rx="13"/><path d="M25 46 C25 72 75 72 75 46"/><path d="M50 68 V86"/><path d="M36 88 H64"/></g></symbol>
<symbol id="ic-pen" viewBox="0 0 100 100"><g class="ln"><path d="M70 14 L86 30 L36 80 L15 86 L21 65 Z"/><path d="M59 25 L75 41"/><path d="M21 65 L36 80"/></g></symbol>
<symbol id="ic-grid" viewBox="0 0 100 100"><g class="ln"><rect x="14" y="14" width="30" height="30" rx="7"/><rect x="56" y="14" width="30" height="30" rx="7"/><rect x="14" y="56" width="30" height="30" rx="7"/></g><rect class="fl" x="56" y="56" width="30" height="30" rx="7"/></symbol>
<symbol id="ic-broadcast" viewBox="0 0 100 100"><g class="ln"><path d="M32 32 A26 26 0 0 0 32 68"/><path d="M68 32 A26 26 0 0 1 68 68"/><path d="M19 19 A44 44 0 0 0 19 81"/><path d="M81 19 A44 44 0 0 1 81 81"/></g><circle class="fl" cx="50" cy="50" r="8"/></symbol>
<symbol id="ic-wave" viewBox="0 0 100 100"><path class="ln" style="stroke-width:7" d="M16 42 V58 M33 28 V72 M50 14 V86 M67 28 V72 M84 42 V58"/></symbol>
<symbol id="ic-play" viewBox="0 0 100 100"><path class="fl" style="stroke:var(--g1);stroke-width:4;stroke-linejoin:round" d="M32 18 L82 50 L32 82 Z"/></symbol>
<symbol id="ic-diamond" viewBox="0 0 100 100"><path class="fl" d="M50 6 L74 50 L50 94 L26 50 Z"/></symbol>
<symbol id="ic-spark" viewBox="0 0 100 100"><path class="fl" d="M50 6 C52 34 66 48 94 50 C66 52 52 66 50 94 C48 66 34 52 6 50 C34 48 48 34 50 6 Z"/></symbol>
</defs></svg>

<div id="stage">
 <div class="bg"></div>
 <div id="baseglow" class="baseglow" style="background:radial-gradient(60% 40% at 50% 38%,rgba(20,128,74,.45),transparent 70%)"></div>
 <svg id="pattern" viewBox="-50 -50 100 100"><g fill="none" stroke="#e9c46a" stroke-width="0.35"><rect x="-30" y="-30" width="60" height="60"/><rect x="-30" y="-30" width="60" height="60" transform="rotate(45)"/><circle r="21.2"/><circle r="30"/><circle r="42.4"/></g></svg>
 <div id="particles" class="particles"></div>
 <div id="vglow" class="vglow"></div>
 <div id="visual" class="visual"></div>
 <div id="logo" class="logo"><div id="ring" class="ring"></div><div id="logobox" class="logobox"><img src="assets/logo.png" alt=""></div></div>
 <div id="panel" class="panel">
  <div class="dots"></div><div id="sweep" class="sweep"></div>
  <div class="orn"><svg class="ic" style="width:30px;height:30px"><use href="#ic-star8"></use></svg><svg class="ic" style="width:34px;height:34px"><use href="#ic-diamond"></use></svg><svg class="ic" style="width:30px;height:30px"><use href="#ic-star8"></use></svg></div>
  <div id="capbox" class="capbox"></div>
  <div id="eq" class="eq"></div>
 </div>
 <div class="vig"></div>
 <div id="prog"><i id="progfill"></i></div>
</div>

<script>
(function(){
'use strict';
const CFG={W:1080,H:1920,eqN:30,eqBase:6,eqRange:40,px:97,patBase:0.13,sweepW:980,capMin:40,
 closeCss:'',
 capSize:L=>L<=40?72:L<=90?66:L<=130?56:50,
 sz:{ar:170,ci:110,cl:62,cci:90,ccl:54,cmin:700,cmax:940,cpad:'34px 50px',crad:40,cgap:30,num:210,num2:160,nl:62,inst:70,badge:780,tap:150,app:54,cls:120},
 logoState(t,c){
  const intro=easeBack(prog(t,0,0.9));
  const o=easeOut(prog(t,0,0.5));
  const k=easeInOut(prog(t,c.brandEnd-0.4,0.7))*(1-easeInOut(prog(t,c.storeStart,0.8)));
  const lv=level(t);
  const s=(0.2+0.8*intro)*(1-0.38*k)*(1+0.012*Math.sin(2.2*t)+0.016*lv);
  return {tf:'translateY('+(-120*k)+'px) scale('+s+')',o:o,rp:prog(t,0.6,1.4)};
 }
};

const W=CFG.W,H=CFG.H,SZ=CFG.sz;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const easeInOut=x=>{x=clamp(x);return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const easeBack=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const prog=(t,s,d)=>clamp((t-s)/d);
const lerp=(a,b,x)=>a+(b-a)*x;
const MOODS={respectful:[233,196,106],happy:[255,190,90],informative:[60,200,170],excited:[170,230,80],calm:[110,170,255],enthusiastic:[255,160,70]};
const CREAM=[255,248,230],GOLD=[233,196,106];
const BRAND='ইসলামী বিশ্বকোষ ও আল হাদিস S2';
const BD='০১২৩৪৫৬৭৮৯';
function fmtNum(n){
  const s=String(Math.round(n));let out;
  if(s.length<=3){out=s;}else{
    const last=s.slice(-3);let rest=s.slice(0,-3);const parts=[];
    while(rest.length>2){parts.unshift(rest.slice(-2));rest=rest.slice(0,-2);}
    if(rest)parts.unshift(rest);
    out=parts.join(',')+','+last;
  }
  return out.replace(/\d/g,d=>BD[d]);
}
/* One design entry per timestamp line (by line index). Sizes come from CFG.sz. */
const PLAN=[
 {t:'greet',ar:'السلام عليكم'},
 {t:'brand'},
 {t:'cards',items:[['book','কানযুল ঈমান'],['book','ইরফানুল কুরআন']]},
 {t:'cards',items:[['book','তাফসীরে মাযহারী']]},
 {t:'cards',items:[['book','তাফসীরে খাযাইনুল ইরফান']],nums:[{v:8,label:'তাফসিরের কাজ চলমান',dur:1.6}]},
 {t:'nums',nums:[{v:45,label:'হাদিস গ্রন্থ',dur:1.4},{v:270335,label:'হাদিস',dur:3.2}]},
 {t:'cards',items:[['book','অফলাইন কিতাব']],nums:[{v:800,plus:1,dur:1.4}]},
 {t:'cards',items:[['phone','অনলাইন পিডিএফ বই']],nums:[{v:1000,plus:1,dur:1.4}]},
 {t:'cards',items:[['pen','লেখক'],['grid','বিষয়ভিত্তিক']]},
 {t:'cards',items:[['clock','নামাজের সময়'],['crescent','সেহরি ইফতার']]},
 {t:'cards',items:[['compass','কিবলা কম্পাস'],['mosque','মসজিদ খুঁজি']]},
 {t:'cards',items:[['beads','ডিজিটাল তাসবিহ'],['phone','সব কিছু এক অ্যাপেই']]},
 {t:'cards',items:[['mic','বয়ান'],['wave','নাত']]},
 {t:'cards',items:[['star8','মাসনুন দোয়া'],['spark','ইসলামিক নাম'],['broadcast','লাইভ হারামাইন সম্প্রচার']]},
 {t:'store'},
 {t:'closing',icons:['star8','book','crescent']}
];
let OPTS={},scenes=[],total=0,levelEnv=null,envFps=30,lastColor=MOODS.respectful.slice();
let ctxLogo={brandStart:0,brandEnd:6,storeStart:1e9,lastStart:1e9};
let els={};
function el(tag,cls,parent,css){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(parent)parent.appendChild(e);return e;}
function icon(name,size){
  const d=document.createElement('div');
  d.innerHTML='<svg class="ic" viewBox="0 0 100 100"><use href="#ic-'+name+'"></use></svg>';
  const s=d.firstChild;s.style.width=size+'px';s.style.height=size+'px';s.style.flex='0 0 auto';return s;
}
function parseTs(raw){
  const out=[];
  String(raw).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const p=l.split('|').map(x=>x.trim());
    if(p.length<3)return;
    const s=parseFloat(p[0]),e=parseFloat(p[1]);
    if(isNaN(s)||isNaN(e))return;
    let mood=(p[3]||'').toLowerCase();if(!MOODS[mood])mood='happy';
    out.push({start:s,end:e,raw:p[2],mood});
  });
  out.sort((a,b)=>a.start-b.start);
  for(let i=0;i<out.length-1;i++){
    if(out[i].end>out[i+1].start+1e-9){
      if(typeof console!=='undefined')console.warn('overlap: trimming scene '+i+' end '+out[i].end+' -> '+out[i+1].start);
      out[i].end=out[i+1].start;
    }
  }
  return out;
}
function segs(raw){
  const out=[];let last=0;const re=/❝([^❞]*)❞/g;let m;
  while((m=re.exec(raw))){if(m.index>last)out.push([raw.slice(last,m.index),0]);out.push([m[1],1]);last=re.lastIndex;}
  if(last<raw.length)out.push([raw.slice(last),0]);
  return out;
}
/* ---------- visual builders ---------- */
function numEl(parent,n,big,lab,delay){
  const box=el('div','numbox',parent);
  const row=el('div','numrow',box,'font-size:'+big+'px');
  const ghost=el('span','ghost',row);ghost.textContent=fmtNum(n.v)+(n.plus?'+':'');
  const live=el('span','live',row);
  let lb=null;
  if(n.label){lb=el('div','numlab',box,'font-size:'+lab+'px');lb.textContent=n.label;}
  return function(lt,lv){
    const p=easeOut(prog(lt,delay,n.dur||1.4));
    live.textContent=fmtNum(n.v*p)+(n.plus?'+':'');
    box.style.opacity=String(easeOut(prog(lt,delay-0.1,0.4)));
    row.style.textShadow='0 0 '+(24+40*lv)+'px rgba(233,196,106,'+(0.4+0.4*lv)+')';
  };
}
const BUILD={
  greet(s,p){
    const d=el('div','arabic',s.vis,'font-size:'+SZ.ar+'px');d.textContent=p.ar;
    return function(lt,lv){
      const k=easeOut(prog(lt,0,0.7));
      d.style.transform='scale('+(0.85+0.15*k)+')';d.style.opacity=String(k);
      d.style.textShadow='0 0 '+(20+50*lv)+'px rgba(233,196,106,'+(0.45+0.45*lv)+'),0 0 6px rgba(233,196,106,0.5)';
    };
  },
  brand(){return null;},
  cards(s,p){
    const items=p.items,compact=items.length>=3;
    const ci=compact?SZ.cci:SZ.ci,cl=compact?SZ.ccl:SZ.cl,stag=compact?0.6:0.8;
    const wrap=el('div','cardcol',s.vis,'gap:'+SZ.cgap+'px');
    const cards=items.map((it,k)=>{
      const c=el('div','card',wrap,'min-width:'+SZ.cmin+'px;max-width:'+SZ.cmax+'px;padding:'+SZ.cpad+';border-radius:'+SZ.crad+'px;gap:'+Math.round(SZ.cgap*1.1)+'px');
      const ic=icon(it[0],ci);c.appendChild(ic);
      const lb=el('div','clabel',c,'font-size:'+cl+'px');lb.textContent=it[1];
      return {c,ic};
    });
    const base=items.length*stag*0.6;
    const nums=(p.nums||[]).map((n,k)=>({f:numEl(wrap,n,k?SZ.num2:SZ.num,SZ.nl,0.45+(items.length>1?base:0)+k*0.5)}));
    return function(lt,lv,t){
      cards.forEach((o,k)=>{
        const d=k*stag;
        const e=easeBack(prog(lt,d,0.7));
        o.c.style.transform='translateX('+((1-e)*280)+'px)';
        o.c.style.opacity=String(easeOut(prog(lt,d,0.35)));
        o.ic.style.transform='translateY('+(Math.sin(2*t+k*1.3)*4)+'px) scale('+(1+0.04*Math.sin(2.4*t+k))+')';
        o.ic.style.filter='drop-shadow(0 0 '+(4+14*lv)+'px rgba(233,196,106,'+(0.35+0.5*lv)+'))';
      });
      nums.forEach(n=>n.f(lt,lv));
    };
  },
  nums(s,p){
    const wrap=el('div','cardcol',s.vis,'gap:'+Math.round(SZ.cgap*0.6)+'px');
    const fs=p.nums.map((n,k)=>numEl(wrap,n,k?SZ.num2:SZ.num,SZ.nl,0.4+k*0.6));
    return function(lt,lv){fs.forEach(f=>f(lt,lv));};
  },
  store(s){
    const wrap=el('div','storecol',s.vis);
    const badge=el('div','badge',wrap,'width:'+SZ.badge+'px');
    if(OPTS.badge){const im=el('img','',badge);im.src=OPTS.badge;im.alt='';}
    else{
      const b=el('div','btn',badge,'font-size:'+SZ.inst+'px;padding:'+Math.round(SZ.inst*0.35)+'px '+Math.round(SZ.inst*0.8)+'px;gap:'+Math.round(SZ.inst*0.35)+'px');
      b.appendChild(icon('play',Math.round(SZ.inst*1.1)));
      const tx=el('span','',b);tx.textContent='ইনস্টল করুন';
    }
    const tap=SZ.tap;
    const ring=el('div','tap',badge,'width:'+tap+'px;height:'+tap+'px;left:72%;top:58%;margin:'+(-tap/2)+'px 0 0 '+(-tap/2)+'px');
    const app=el('div','appname',wrap,'font-size:'+SZ.app+'px');app.textContent=BRAND;
    return function(lt,lv,t){
      const pp=easeBack(prog(lt,0.4,0.7));
      badge.style.transform='translateY('+(Math.sin(2*t)*8)+'px) scale('+(0.1+0.9*pp)+')';
      badge.style.opacity=String(easeOut(prog(lt,0.4,0.3)));
      if(lt>=2.0){const ph=((lt-2.0)%1.3)/1.3;ring.style.opacity=String(0.85*(1-ph));ring.style.transform='scale('+(0.3+1.1*ph)+')';}
      else ring.style.opacity='0';
      const a=easeOut(prog(lt,1.2,0.5));app.style.opacity=String(a);app.style.transform='translateY('+((1-a)*24)+'px)';
    };
  },
  closing(s,p){
    const row=el('div','closerow',s.vis,'gap:'+Math.round(SZ.cls*0.6)+'px;'+CFG.closeCss);
    const ics=p.icons.map(n=>{const i=icon(n,SZ.cls);row.appendChild(i);return i;});
    return function(lt,lv,t){
      ics.forEach((i,k)=>{
        const e=easeBack(prog(lt,0.15+k*0.25,0.7));
        i.style.opacity=String(easeOut(prog(lt,0.15+k*0.25,0.4)));
        i.style.transform='translateY('+(Math.sin(1.8*t+k*1.2)*8)+'px) scale('+(e*(1+0.05*Math.sin(2.2*t+k*0.9)))+')';
        i.style.filter='drop-shadow(0 0 '+(6+22*lv)+'px rgba(233,196,106,'+(0.4+0.5*lv)+'))';
      });
    };
  }
};
/* ---------- scene construction ---------- */
function buildScene(sc,i,n){
  const s=Object.assign({},sc,{i,last:i===n-1});
  const plan=PLAN[i]||{t:'cards',items:[['diamond',null]]};
  s.vis=el('div','vscene',els.visual);
  s.cap=el('div','cap',els.capbox);
  const words=[];
  segs(sc.raw).forEach(g=>g[0].split(/\s+/).filter(Boolean).forEach(w=>words.push({txt:w,hl:g[1]})));
  s.text=words.map(w=>w.txt).join(' ');
  const total=words.reduce((a,w)=>a+w.txt.length+1,0);
  const dur=sc.end-sc.start,span=Math.max(0.6,dur-0.55);
  let cum=0;
  s.words=words.map(w=>{
    const wt=w.txt.length+1;
    const st=0.15+(cum/total)*span,en=st+(wt/total)*span;cum+=wt;
    const e=el('span','w',s.cap);e.textContent=w.txt;
    return {el:e,st,en,hl:w.hl};
  });
  const L=s.text.length;
  s.size=CFG.capSize(L);
  s.cap.style.fontSize=s.size+'px';
  if(plan.t==='cards'&&plan.items[0][1]===null)plan.items[0][1]=s.text;
  s.type=plan.t;
  s.upd=BUILD[plan.t](s,plan);
  return s;
}
function sceneOp(s,t){
  if(t<s.start-0.01)return {op:0,ty:0};
  if(!s.last&&t>s.end+0.01)return {op:0,ty:0};
  const ent=easeOut(prog(t,s.start-0.01,0.45));
  const ex=s.last?1:1-easeOut(prog(t,s.end-0.3,0.3));
  return {op:ent*ex,ty:(1-ent)*40};
}
window.init=function(raw,opts){
  OPTS=opts||{};
  els={visual:$('visual'),capbox:$('capbox'),eq:$('eq'),particles:$('particles'),pattern:$('pattern'),baseglow:$('baseglow'),vglow:$('vglow'),panel:$('panel'),sweep:$('sweep'),logo:$('logo'),logobox:$('logobox'),ring:$('ring'),prog:$('progfill')};
  const sc=parseTs(raw);
  scenes=sc.map((x,i)=>buildScene(x,i,sc.length));
  total=(scenes.length?scenes[scenes.length-1].end:0)+0.5;
  const bi=scenes.findIndex(s=>s.type==='brand');
  ctxLogo.brandStart=bi>=0?scenes[bi].start:0;
  ctxLogo.brandEnd=bi>=0?scenes[bi].end:6.0;
  ctxLogo.storeStart=scenes.length>1?scenes[scenes.length-2].start:1e9;
  ctxLogo.lastStart=scenes.length?scenes[scenes.length-1].start:1e9;
  els.stars=[];
  for(let i=0;i<38;i++){const sz=3+(i%4)*2;els.stars.push(el('i','',els.particles,'width:'+sz+'px;height:'+sz+'px'));}
  els.bars=[];
  for(let i=0;i<CFG.eqN;i++)els.bars.push(el('i','',els.eq));
  if(CFG.orn)CFG.orn();
  return total;
};
window.fit=function(){
  const box=els.capbox,out=[];
  scenes.forEach(s=>{
    let size=s.size;
    s.cap.style.fontSize=size+'px';
    const over=()=>{
      let mn=1e9,mx=-1e9;
      s.words.forEach(w=>{mn=Math.min(mn,w.el.offsetTop);mx=Math.max(mx,w.el.offsetTop+w.el.offsetHeight);});
      return (mx-mn)>box.clientHeight||s.cap.scrollWidth>s.cap.clientWidth+1;
    };
    while(size>CFG.capMin&&over()){size-=2;s.cap.style.fontSize=size+'px';}
    s.size=size;out.push(size);
  });
  return out;
};
window.setAudio=function(env,fps){levelEnv=env&&env.length?env:null;envFps=fps||30;};
function level(t){
  if(levelEnv){const i=Math.floor(t*envFps);return clamp(levelEnv[((i%levelEnv.length)+levelEnv.length)%levelEnv.length]);}
  return clamp(0.38+0.20*Math.sin(3.1*t)+0.12*Math.sin(7.7*t+1));
}
const rgb=(c,a)=>'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+a+')';
const mix=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
window.seek=function(t){
  const lv=level(t);
  let sp=0,cr=0,cg=0,cb=0,cw=0,mouth=0;
  scenes.forEach(s=>{
    const o=sceneOp(s,t);
    if(o.op<=0.001){s.vis.style.opacity='0';s.vis.style.visibility='hidden';s.cap.style.opacity='0';s.cap.style.visibility='hidden';return;}
    const tr='translateY('+o.ty+'px)';
    s.vis.style.visibility='visible';s.vis.style.opacity=String(o.op);s.vis.style.transform=tr;
    s.cap.style.visibility='visible';s.cap.style.opacity=String(o.op);s.cap.style.transform=tr;
    const lt=t-s.start;
    s.words.forEach((w,k)=>{
      const f=easeOut(prog(lt,w.st,0.3));
      const a=easeOut(prog(lt,w.st,0.12))*(1-easeOut(prog(lt,w.en-0.05,0.14)));
      w.el.style.opacity=String(f);
      w.el.style.transform='translateY('+(26*(1-f)-6*a)+'px) scale('+(1+0.07*a)+')';
      if(w.hl){w.el.style.color=rgb(GOLD,1);w.el.style.textShadow='0 0 '+(14+34*a)+'px '+rgb(GOLD,0.35+0.55*a);}
      else{w.el.style.color=rgb(mix(CREAM,GOLD,a),1);w.el.style.textShadow=a>0.01?'0 0 '+(34*a)+'px '+rgb(GOLD,0.9*a):'none';}
      if(a>0.001)mouth=Math.max(mouth,a*(0.30+0.70*Math.abs(Math.sin(lt*13+k*1.7))));
    });
    if(s.upd)s.upd(lt,lv,t);
    sp=Math.max(sp,o.op);
    const mc=MOODS[s.mood];cr+=mc[0]*o.op;cg+=mc[1]*o.op;cb+=mc[2]*o.op;cw+=o.op;
  });
  if(cw>0)lastColor=[cr/cw,cg/cw,cb/cw];
  const mc=lastColor;
  mouth*=0.75+0.25*lv;
  els.baseglow.style.opacity=String(0.72+0.28*lv);
  els.pattern.style.opacity=String(CFG.patBase+0.07*lv);
  els.pattern.style.transform='rotate('+(2.2*t)+'deg)';
  els.stars.forEach((e,i)=>{
    const x=(((i*CFG.px+Math.sin(0.4*t+i)*40)%W)+W)%W;
    const y=H-((t*(20+(i%7)*9)+i*131)%(H+60));
    e.style.transform='translate('+x+'px,'+y+'px)';
    e.style.opacity=String(clamp(0.25+0.35*((i%5)/5)+0.2*lv));
  });
  els.vglow.style.background='radial-gradient(closest-side,'+rgb(mc,0.5)+',transparent)';
  els.vglow.style.opacity=String(sp*(0.5+0.35*lv));
  els.panel.style.setProperty('--ang',(t*90)+'deg');
  els.panel.style.boxShadow='0 0 '+(24+80*lv)+'px '+(4+14*lv)+'px '+rgb(mc,0.22+0.45*lv);
  els.sweep.style.transform='translateX('+(((t*0.22)%1.6-0.4)*CFG.sweepW)+'px)';
  els.bars.forEach((b,i)=>{
    const wave=0.5+0.5*Math.abs(Math.sin(6*t+0.7*i));
    const shape=0.65+0.35*Math.sin(0.45*i+1);
    b.style.height=(CFG.eqBase+CFG.eqRange*clamp(lv*1.15*wave*shape+0.04))+'px';
  });
  els.prog.style.width=(100*clamp(t/total))+'%';
  const L=CFG.logoState(t,ctxLogo,els.logo);
  els.logo.style.transform=L.tf;
  els.logo.style.opacity=String(L.o);
  const pr=L.rp;
  els.ring.style.opacity=String(pr>0&&pr<1?0.8*(1-pr):0);
  els.ring.style.transform='scale('+(1+0.35*clamp(pr))+')';
  els.logobox.style.boxShadow='0 0 0 6px #e9c46a,0 0 '+(30+90*lv)+'px rgba(233,196,106,'+(0.3+0.3*lv)+')';
  if(CFG.onFrame)CFG.onFrame(t,{lv:lv,sp:sp,m:mouth,color:mc});
};
window.__info=function(){return {total:total,scenes:scenes.map(s=>({start:s.start,end:s.end,type:s.type,size:s.size,text:s.text}))};};

})();
</script>
