<script>
(function () {
'use strict';
/* ---------- helpers (pure functions of time; no timers, no randomness) ---------- */
function clamp(x, a, b) { a = a === undefined ? 0 : a; b = b === undefined ? 1 : b; return x < a ? a : (x > b ? b : x); }

function easeOut(x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); }
function easeInOut(x) { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function easeBack(x) { x = clamp(x); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

/* ---------- number words (Bengali) -> numerals ---------- */

  'শূন্য': 0, 'এক': 1, 'দুই': 2, 'দু': 2, 'তিন': 3, 'চার': 4, 'পাঁচ': 5, 'ছয়': 6, 'সাত': 7, 'আট': 8, 'নয়': 9, 'দশ': 10,

  'পঁয়তাল্লিশ': 45, 'ছেচল্লিশ': 46, 'সাতচল্লিশ': 47, 'আটচল্লিশ': 48, 'ঊনপঞ্চাশ': 49, 'উনপঞ্চাশ': 49, 'পঞ্চাশ': 50,
  'একান্ন': 51, 'বাহান্ন': 52, 'তিপ্পান্ন': 53, 'চুয়ান্ন': 54, 'পঞ্চান্ন': 55, 'ছাপ্পান্ন': 56, 'সাতান্ন': 57, 'আটান্ন': 58,
  'ঊনষাট': 59, 'উনষাট': 59, 'ষাট': 60, 'একষট্টি': 61, 'বাষট্টি': 62, 'তেষট্টি': 63, 'চৌষট্টি': 64, 'পঁয়ষট্টি': 65, 'ছেষট্টি': 66,
  'সাতষট্টি': 67, 'আটষট্টি': 68, 'ঊনসত্তর': 69, 'উনসত্তর': 69, 'সত্তর': 70, 'একাত্তর': 71, 'বাহাত্তর': 72, 'তিয়াত্তর': 73,
  'চুয়াত্তর': 74, 'পঁচাত্তর': 75, 'ছিয়াত্তর': 76, 'সাতাত্তর': 77, 'আটাত্তর': 78, 'ঊনআশি': 79, 'উনআশি': 79, 'আশি': 80,
  'একাশি': 81, 'বিরাশি': 82, 'তিরাশি': 83, 'চুরাশি': 84, 'পঁচাশি': 85, 'ছিয়াশি': 86, 'সাতাশি': 87, 'অষ্টাশি': 88,
  'ঊননব্বই': 89, 'উননব্বই': 89, 'নব্বই': 90, 'একানব্বই': 91, 'বিরানব্বই': 92, 'তিরানব্বই': 93, 'চুরানব্বই': 94,
  'পঁচানব্বই': 95, 'ছিয়ানব্বই': 96, 'সাতানব্বই': 97, 'আটানব্বই': 98, 'নিরানব্বই': 99
};
var MULT0 = { 'শত': 100, 'শো': 100, 'হাজার': 1000, 'লক্ষ': 100000, 'লাখ': 100000, 'কোটি': 10000000 };
var NUM = {}, MULT = {};
Object.keys(N0).forEach(function (k) { NUM[nrm(k)] = N0[k]; });
Object.keys(MULT0).forEach(function (k) { MULT[nrm(k)] = MULT0[k]; });
var SUFFIX = ['টির', 'টি', 'টা', 'ের', 'র', 'ে'].map(nrm);

function stripPunct(w) { return w.replace(/^[।,.!?;:،"'“”‘’()]+/, '').replace(/[।,.!?;:،"'“”‘’()]+$/, ''); }
/* returns {v, m} (v = number word value or null, m = multiplier or null) or null */
function numTok(raw) {
  var w = nrm(stripPunct(raw));
  if (!w) return null;
  var cands = [w];
  SUFFIX.forEach(function (s) { if (w.length > s.length && w.slice(-s.length) === s) cands.push(w.slice(0, -s.length)); });
  for (var i = 0; i < cands.length; i++) {
    var c = cands[i];
    if (Object.prototype.hasOwnProperty.call(NUM, c)) return { v: NUM[c], m: null };
    if (Object.prototype.hasOwnProperty.call(MULT, c)) return { v: null, m: MULT[c] };
    var mk = Object.keys(MULT);
    for (var j = 0; j < mk.length; j++) {
      var m = mk[j];
      if (c.length > m.length && c.slice(-m.length) === m) {
        var rest = c.slice(0, -m.length);
        if (Object.prototype.hasOwnProperty.call(NUM, rest)) return { v: NUM[rest], m: MULT[m] };
      }
    }
  }
  return null;
}
function runValue(toks) {
  var total = 0, cur = 0;
  toks.forEach(function (k) {
    if (k.m === null) { cur += k.v; return; }
    if (k.v !== null) { /* fused: e.g. তিনশো */
      if (k.m === 100) cur += k.v * 100; else { total += (cur + k.v) * k.m; cur = 0; }
    } else { /* pure multiplier */
      if (k.m === 100) cur = (cur || 1) * 100; else { total += (cur || 1) * k.m; cur = 0; }
    }
  });
  return total + cur;
}
var STOPW = ['এখন', 'এক', 'ও', 'এবং', 'এতে', 'আছে', 'রয়েছে', 'সব', 'সাথে'].map(nrm);
var PLUSW = ['বেশি', 'বেশী', 'অধিক'].map(nrm);
function extractNumbers(plain, maxLabel) {
  var toks = plain.split(/\s+/).filter(Boolean);
  var info = toks.map(numTok);
  var out = [], i = 0;
  while (i < toks.length) {
    if (!info[i]) { i++; continue; }
    var j = i, run = [];
    while (j < toks.length && info[j]) { run.push(info[j]); j++; if (/[।,.!?;:،]$/.test(toks[j - 1])) break; }
    var onlyOne = run.length === 1 && run[0].v === 1 && run[0].m === null;
    if (onlyOne) { i = j; continue; }
    var val = runValue(run), plus = false, k = j;
    if (k < toks.length && nrm(stripPunct(toks[k])) === nrm('এর')) k++;
    if (k < toks.length && PLUSW.indexOf(nrm(stripPunct(toks[k]))) >= 0) { plus = true; k++; }
    var label = [];
    if (!/[।,.!?;:،]$/.test(toks[j - 1]) || plus) {
      while (k < toks.length && label.length < maxLabel) {
        var tk = toks[k], bare = nrm(stripPunct(tk));
        if (info[k] || STOPW.indexOf(bare) >= 0) break;
        label.push(stripPunct(tk));
        k++;
        if (/[।,.!?;:،]$/.test(tk)) break;
      }
    }
    out.push({ v: val, plus: plus, label: label.join(' '), srcWords: toks.slice(i, j).join(' ') });
    i = Math.max(k, j);
  }
  return out;
}

/* ---------- icons ---------- */
var ICONS = [['কুরআন', '📖'], ['তাফসীর', '📚'], ['তাফসির', '📚'], ['হাদিস', '📜'], ['কিতাব', '📕'], ['পিডিএফ', '📗'], ['বই', '📗'],
  ['নামাজ', '🕌'], ['মসজিদ', '🕌'], ['সেহরি', '🌙'], ['ইফতার', '🌇'], ['কিবলা', '🧭'], ['কম্পাস', '🧭'], ['তাসবিহ', '📿'],
  ['বয়ান', '🎙️'], ['নাত', '🎶'], ['দোয়া', '🤲'], ['নাম', '🏷️'], ['হারামাইন', '🕋'], ['সম্প্রচার', '📡'], ['লেখক', '✍️']];
var DEFAULT_ICONS = ['📖', '🌙', '⭐'];
function iconFor(text, i) {
  var n = nrm(text);
  for (var k = 0; k < ICONS.length; k++) if (n.indexOf(nrm(ICONS[k][0])) >= 0) return ICONS[k][1];
  return DEFAULT_ICONS[(i || 0) % DEFAULT_ICONS.length];
}

/* ---------- card items ---------- */
var FILL = ['আরও', 'রয়েছে', 'এতে', 'পাবেন', 'সাথে', 'সম্পূর্ণ', 'এখন', 'এক', 'অ্যাপেই', 'সব', 'কিছু', 'চলমান'].map(nrm);
function wordsOf(s) { return s.split(/\s+/).map(stripPunct).filter(Boolean); }
function trimFill(ws) {
  ws = ws.slice();
  while (ws.length && FILL.indexOf(nrm(ws[0])) >= 0) ws.shift();
  while (ws.length && FILL.indexOf(nrm(ws[ws.length - 1])) >= 0) ws.pop();
  return ws;
}
function hasNum(ws) { return ws.some(function (w) { return numTok(w); }); }
function extractCards(plain) {
  var t = plain.replace(/[।!?]/g, '').trim();
  var pieces = [];
  t.split(/\s*[,،]\s*/).forEach(function (c) {
    c.split(/\s+(?:ও|এবং)\s+/).forEach(function (p) { if (p.trim()) pieces.push(trimFill(wordsOf(p))); });
  });
  pieces = pieces.filter(function (p) { return p.length; });
  if (pieces.length >= 2) {
    var rest = pieces.slice(1), k = 0;
    rest.forEach(function (p) { k = Math.max(k, p.length); });
    if (pieces[0].length > k) pieces[0] = pieces[0].slice(-k);
    var mx = 0, mn = 99;
    pieces.forEach(function (p) { mx = Math.max(mx, p.length); mn = Math.min(mn, p.length); });

    return pieces.slice(0, 3).map(function (p) { return p.join(' '); });
  }

    var ws = pieces[0], i;
    var sahaIdx = -1, sub = nrm('সহ');

    if (sahaIdx >= 0) {
      var c = ws.slice(0, sahaIdx + 1); c[c.length - 1] = c[c.length - 1].slice(0, -2);

    var sabIdx = ws.map(nrm).indexOf(nrm('সব'));

}

/* ---------- timestamps ---------- */
function markWords(text) {
  var words = [], cur = '', hl = false, curHl = false;
  function push() { if (cur) { words.push({ t: cur, hl: curHl }); cur = ''; curHl = false; } }
  Array.from(text).forEach(function (ch) {
    if (ch === '❝') { push(); hl = true; return; }
    if (ch === '❞') { push(); hl = false; return; }
    if (/\s/.test(ch)) { push(); return; }
    if (!cur) curHl = hl;
    cur += ch;
  });
  push();
  return words;
}
function parseTs(raw) {
  var out = [];
  String(raw).split(/\r?\n/).forEach(function (line, li) {
    if (!line.trim()) return;
    var p = line.split('|');
    if (p.length < 3) { console.warn('timestamps line ' + (li + 1) + ': expected start | end | text | mood'); return; }
    var a = parseFloat(p[0]), b = parseFloat(p[1]);
    if (isNaN(a) || isNaN(b) || b <= a) { console.warn('timestamps line ' + (li + 1) + ': bad times'); return; }
    var mood = (p[3] || '').trim().toLowerCase();
    if (!MOODS[mood]) mood = 'happy';
    var w = markWords(p[2].trim());
    out.push({
      start: a, end: b, mood: mood, words: w,
      plain: w.map(function (x) { return x.t; }).join(' '),
      hlText: w.filter(function (x) { return x.hl; }).map(function (x) { return x.t; }).join(' ')

    T.logoImg.onload = function () { res(true); };
    T.logoImg.onerror = function () { console.warn('logo failed to load: ' + (st.opts.logo || 'assets/logo.png')); res(false); };
    T.logoImg.src = st.opts.logo || 'assets/logo.png';
  }));
  buildScenes();
  if (st.opts.badge) {
    proms.push(processBadge(st.opts.badge).then(function (url) {
      st.badgeUrl = url;
      st.badgeEls.forEach(function (im) {
        if (!url) { im.style.display = 'none'; return; }
        im.src = url; im.style.display = '';
      });
      return Promise.all(st.badgeEls.map(function (im) { return im.decode ? im.decode().catch(function () {}) : null; }));
    }));
  }
  window.__ready = st.ready = Promise.all(proms);
  window.seek(0);
  return st.dur;
};

window.fit = function () {
  var out = [];
  st.scenes.forEach(function (s) {
    var fs = T.capStart(s.plain.length), cap = s.cap, vs = cap.style.visibility, ct = cap.firstChild;
    cap.style.visibility = 'hidden'; cap.style.opacity = '1';
    function overflows() {
      var top = 1e9, bot = -1e9, wmax = 0;
      for (var i = 0; i < s.words.length; i++) {
        var e = s.words[i].el;
        top = Math.min(top, e.offsetTop); bot = Math.max(bot, e.offsetTop + e.offsetHeight);
        wmax = Math.max(wmax, e.offsetWidth);
      }
      return top < -1 || bot > cap.clientHeight + 1 || wmax > cap.clientWidth;
    }
    cap.style.fontSize = fs + 'px';
    while (fs > T.capMin && overflows()) { fs -= 2; cap.style.fontSize = fs + 'px'; }
    cap.style.visibility = vs;
    /* visual area: shrink the visual uniformly if it is larger than its area */
    var inner = s.inner, aw = T.area.clientWidth, ah = T.area.clientHeight;
    inner.style.transform = 'none';
    var iw = inner.offsetWidth, ih = inner.offsetHeight;
    s.vsc = Math.min(1, (aw * 0.97) / Math.max(iw, 1), (ah * 0.97) / Math.max(ih, 1));
    out.push({ scene: s.idx, font: fs, visualScale: +s.vsc.toFixed(3), overflow: overflows() });
  });
  window.seek(0);
  return out;
};

window.seek = function (t) {
  var lv = level(t), best = null, bo = 0;
  for (var i = 0; i < st.scenes.length; i++) {
    var o = updateScene(st.scenes[i], t, lv);
    if (o > bo) { bo = o; best = st.scenes[i]; }
  }
  var rgb = best ? MOODS[best.mood] : GOLD;
  T.frame({ t: t, lv: lv, sp: bo, rgb: rgb, m: best ? best.mouth : 0, best: best, dur: st.dur });
};

window.setAudio = function (envelope, fps) { st.env = envelope && envelope.length ? envelope : null; st.fps = fps || 30; };
window.__debug = function () { return { scenes: st.scenes.map(function (s) { return { start: s.start, end: s.end, mood: s.mood, type: s.dsg.type, cards: s.dsg.cards, nums: s.dsg.nums, plain: s.plain, hl: s.hlText, emoji: s.dsg.emoji }; }), lay: st.lay, dur: st.dur, theme: T.name, state: T._m !== undefined ? { mouth: T._m, arm: T._ang, logoScale: T._sc, headY: T._hy } : null }; };
})();

</script>
