<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Infographic 9:16</title>
<script src="common.js"></script>
</head>
<body>
<div id="stage">
  <div id="vis" class="abs" style="left:60px;top:470px;width:960px;height:740px"></div>
  <div id="logo" class="abs" style="left:280px;top:190px;width:520px;transform-origin:50% 0">
    <div id="lring" class="abs" style="left:0;top:0;right:0;bottom:0;border-radius:56px;border:6px solid #e9c46a;opacity:0"></div>
    <div id="lcard" style="border-radius:56px;border:6px solid #e9c46a;background:#fff;overflow:hidden"><img alt="" style="display:block;width:100%;height:auto"></div>
  </div>
  <div id="panel" style="left:50px;top:1230px;width:980px;height:540px">
    <div id="capbox" class="abs" style="left:56px;top:74px;right:56px;bottom:96px"></div>
    <div id="eq" style="left:90px;right:90px;bottom:30px;height:48px"></div>
  </div>
</div>
<script>
(function () {
  var C = window.Core;
  var S = { arabic: 170, icon: 110, label: 62, iconC: 90, labelC: 54, cardMin: 700, cardMax: 940, padV: 34, padH: 50, radius: 40, gap: 30,
            num: 210, num2: 160, numLabel: 62, btn: 70, badgeW: 780, tap: 150, appName: 54, closeIcon: 120 };
  var logoEl, lringEl, lcardEl;
  C.run({
    W: 1080, H: 1920, S: S, px: 97,
    bg: 'radial-gradient(120% 80% at 50% 30%, #0a4a2a 0%, #04210f 55%, #021208 100%)',
    glow: 'radial-gradient(60% 40% at 50% 30%, rgba(20,128,74,.5), transparent 70%)',
    star: { cx: 540, cy: 768, size: 2200, op: 0.13 },
    progress: 'left:70px;right:70px;bottom:90px;height:12px',
    panelR: 64, eq: { n: 30, base: 6, range: 40 }, brandIcon: 260,
    capStart: function (n) { return n <= 40 ? 72 : n <= 90 ? 66 : n <= 130 ? 56 : 50; }, capMin: 40,
    panelOrn: function (pin, Core) {
      var d = document.createElement('div'); d.style.cssText = 'position:absolute;top:20px;left:0;right:0;height:34px;display:flex;justify-content:center;align-items:center;gap:14px';
      d.innerHTML = Core.icon('star4', 28) + Core.icon('diamond', 34) + Core.icon('star4', 28); pin.appendChild(d);
    },
    onInit: function (st, els) { logoEl = els.logo; lringEl = document.getElementById('lring'); lcardEl = document.getElementById('lcard'); },
    onSeek: function (t, x) {
      var st = x.st, brandEnd = st.brand ? st.brand.end : 5.6, n = st.scenes.length;
      var growStart = n >= 2 ? st.scenes[n - 2].start : Math.max(0, st.total - 9);
      var intro = C.easeBack(C.prog(t, 0, 0.9)), op = C.easeOut(C.prog(t, 0, 0.5));
      var shrink = C.easeInOut(C.prog(t, brandEnd, 0.7)), grow = C.easeInOut(C.prog(t, growStart, 0.8)), f = shrink * (1 - grow);
      var sc = (0.2 + 0.8 * intro) * (1 - 0.38 * f) * (1 + 0.016 * x.lv + 0.006 * Math.sin(2.2 * t));
      logoEl.style.opacity = op; logoEl.style.transform = 'translateY(' + (-120 * f).toFixed(2) + 'px) scale(' + sc.toFixed(4) + ')';
      lcardEl.style.boxShadow = '0 0 ' + (30 + 90 * x.lv).toFixed(1) + 'px rgba(233,196,106,' + (0.35 + 0.3 * x.lv).toFixed(3) + ')';
      var rp = C.prog(t, 0.6, 1.4); lringEl.style.opacity = rp > 0 && rp < 1 ? 0.8 * (1 - rp) : 0; lringEl.style.transform = 'scale(' + (1 + 0.45 * C.easeOut(rp)) + ')';
    }
  });
})();
</script>
</body>
</html>
