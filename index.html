<script>
const MOOD_COLORS={respectful:[233,196,106],happy:[255,190,90],informative:[60,200,170],excited:[170,230,80],calm:[110,170,255],enthusiastic:[255,160,70]};
function easeOut(x){return 1-Math.pow(1-x,3)}
function easeInOut(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function easeBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function prog(t,s,d){return clamp((t-s)/d,0,1)}

let scenes=[], totalDuration=0, audioEnvelope=null, audioFps=30, optsGlobal={}, brandSceneEnd=5.6, lastSceneStart=0;
let currentScene=null;
let wordTimings=[]; // per scene

function parseTimestamps(txt){
  const lines=txt.split('\n').filter(l=>l.trim().length>0);
  const out=[];
  for(let i=0;i<lines.length;i++){
    const parts=lines[i].split('|');
    if(parts.length<3) continue;
    let s=parseFloat(parts[0].trim());
    let e=parseFloat(parts[1].trim());
    let text=parts[2].trim();
    let mood=(parts[3]||'happy').trim().toLowerCase();
    if(!(mood in MOOD_COLORS)) mood='happy';
    // gold markers
    let golds=[];
    const regex=/\u275D(.*?)\u275E/g;
    let m; while((m=regex.exec(text))!==null){ golds.push(m[1]); }
    let display=text.replace(/\u275D/g,'').replace(/\u275E/g,'');
    out.push({start:s,end:e,text:display,raw:text,golds,mood,idx:out.length});
  }
  out.sort((a,b)=>a.start-b.start);
  for(let i=0;i<out.length-1;i++){
    if(out[i].end>out[i+1].start){
      console.warn(`Overlap trim scene ${i} ${out[i].end}->${out[i+1].start}`);
      out[i].end=out[i+1].start;
    }
  }
  return out;
}

function bnToLatinNumberWord(t){
  // map Bengali number words to digits - limited
  const map={
    'দুটি':2,'দুই':2,'আটটি':8,'আট':8,'পঁয়তাল্লিশটি':45,'পঁয়তাল্লিশ':45,'পয়তাল্লিশ':45,
    'আটশত':800,'আটশ':800,'এক হাজার':1000,'এক হাজারের':1000,
    'দুই লক্ষ সত্তর হাজার তিনশো পঁয়ত্রিশটি':270335,
    'দুই লক্ষ সত্তর হাজার তিনশো পঁয়ত্রিশ':270335,
    'দুই লক্ষ সত্তর হাজার':270000,
  };
  t=t.trim();
  if(map[t]!==undefined) return map[t];
  // digits
  const d=t.match(/[0-9]+/);
  if(d) return parseInt(d[0],10);
  return null;
}

function extractNumbers(sceneText){
  const nums=[];
  // look for Bengali phrases
  if(/পঁয়তাল্লিশ/.test(sceneText)) nums.push({spoken:'পঁয়তাল্লিশটি',value:45,plus:false});
  if(/দুই লক্ষ সত্তর হাজার তিনশো পঁয়ত্রিশ/.test(sceneText)) nums.push({spoken:'দুই লক্ষ সত্তর হাজার তিনশো পঁয়ত্রিশটি',value:270335,plus:false});
  if(/দুটি/.test(sceneText)) nums.push({spoken:'দুটি',value:2,plus:false});
  if(/আটটি/.test(sceneText)) nums.push({spoken:'আটটি',value:8,plus:false});
  if(/আটশত/.test(sceneText)) nums.push({spoken:'আটশত',value:800,plus:true});
  if(/এক হাজারের বেশি/.test(sceneText)||/এক হাজার/.test(sceneText)) nums.push({spoken:'এক হাজারের বেশি',value:1000,plus:true});
  return nums;
}

function buildVisualConfig(scene, isLast){
  const txt=scene.text;
  const lower=txt.toLowerCase();
  let type='card';
  if(/আসসালামু আলাইকুম/.test(txt)) type='greeting';
  else if(scene.golds.length>0 || /ইসলামী বিশ্বকোষ ও আল হাদিস/.test(txt)) type='brand';
  else if(/প্লে স্টোর/.test(txt) || /play store/i.test(txt) || /ইনস্টল করুন/.test(txt)) type='badge';
  else if(isLast) type='closing';
  else if(/,/.test(txt) || /，/.test(txt)){
    // check list
    type='cards';
  }
  const numbers=extractNumbers(txt);
  return {type,numbers};
}

function makeEmojiForLabel(label){
  const l=label.toLowerCase();
  if(/কুরআন|তাফসীর|তাফসির|অনুবাদ/.test(label)) return '📖';
  if(/হাদিস/.test(label)) return '📚';
  if(/কিতাব|পিডিএফ|বই/.test(label)) return '📚';
  if(/নামাজ/.test(label)) return '🕌';
  if(/সেহরি|ইফতার/.test(label)) return '🌙';
  if(/কিবলা/.test(label)) return '🧭';
  if(/মসজিদ/.test(label)) return '🕌';
  if(/তাসবিহ/.test(label)) return '📿';
  if(/বয়ান/.test(label)) return '🎙️';
  if(/নাত/.test(label)) return '🎵';
  if(/দোয়া/.test(label)) return '🤲';
  if(/নাম|হারামাইন/.test(label)) return '🕋';
  if(/লাইভ/.test(label)) return '📡';
  return '✦';
}

function createCard(label, compact){
  const div=document.createElement('div');
  div.className='card'+(compact?' compact':'');
  const icon=document.createElement('div'); icon.className='card-icon'; icon.textContent=makeEmojiForLabel(label);
  const lab=document.createElement('div'); lab.className='card-label'; lab.textContent=label.trim();
  div.appendChild(icon); div.appendChild(lab);
  return div;
}

function buildDOMForScenes(){
  const screenContent=document.getElementById('screenContent');
  screenContent.innerHTML='';
  const captionText=document.getElementById('captionText');
  captionText.innerHTML='';
  scenes.forEach((sc,si)=>{
    const cfg=buildVisualConfig(sc, si===scenes.length-1);
    sc.cfg=cfg;
    // visual container
    const wrap=document.createElement('div');
    wrap.className='visual-wrap';
    wrap.dataset.idx=si;
    wrap.style.position='absolute'; wrap.style.left='0'; wrap.style.top='0'; wrap.style.width='100%'; wrap.style.height='100%';
    wrap.style.opacity='0';
    wrap.style.pointerEvents='none';
    if(cfg.type==='greeting'){
      const arab=document.createElement('div'); arab.className='arabic-greeting'; arab.textContent='السلام عليكم';
      wrap.appendChild(arab);
    } else if(cfg.type==='brand'){
      const badge=document.createElement('div'); badge.style.fontSize='56px'; badge.style.color='#e9c46a'; badge.textContent='✦ ইসলামী বিশ্বকোষ ✦';
      badge.style.fontFamily='SolaimanLipi';
      wrap.appendChild(badge);
    } else if(cfg.type==='badge'){
      const bw=document.createElement('div'); bw.className='badge-wrap';
      const img=document.createElement('img'); img.className='badge-img badge-float'; img.id='badgeImg'+si;
      if(optsGlobal.badge){
        img.src=optsGlobal.badge;
      } else {
        img.style.display='none';
        const neut=document.createElement('div'); neut.className='neutral-btn';
        neut.innerHTML='<span>▶</span><span>ইনস্টল করুন</span>';
        bw.appendChild(neut);
      }
      bw.appendChild(img);
      const ring=document.createElement('div'); ring.className='tap-ring'; ring.id='tapRing'+si;
      bw.appendChild(ring);
      const appName=document.createElement('div'); appName.className='app-name-under'; appName.textContent='ইসলামী বিশ্বকোষ ও আল হাদিস S2';
      bw.appendChild(appName);
      wrap.appendChild(bw);
    } else if(cfg.type==='closing'){
      const row=document.createElement('div'); row.className='closing-emoji-row';
      row.innerHTML='<span>🤲</span><span>📖</span><span>🕌</span>';
      wrap.appendChild(row);
    } else if(cfg.type==='cards' || cfg.type==='card'){
      const labels=txtSplitLabels(sc.text);
      const compact=labels.length>=3;
      const row=document.createElement('div'); row.className='card-row';
      labels.slice(0,3).forEach((lab,j)=>{
        const card=createCard(lab, compact);
        card.dataset.j=j;
        row.appendChild(card);
      });
      wrap.appendChild(row);
      if(cfg.numbers.length>0){
        cfg.numbers.forEach(n=>{
          const cw=document.createElement('div'); cw.className='counter-wrap';
          const numEl=document.createElement('div'); numEl.className='counter-num'; numEl.dataset.value=n.value; numEl.dataset.plus=n.plus?'1':'0'; numEl.dataset.spoken=n.spoken; numEl.textContent='0';
          const lab=document.createElement('div'); lab.className='counter-label'; lab.textContent=n.spoken;
          cw.appendChild(numEl); cw.appendChild(lab); wrap.appendChild(cw);
        });
      }
    } else {
      // generic
      if(cfg.numbers.length>0){
        cfg.numbers.forEach(n=>{
          const cw=document.createElement('div'); cw.className='counter-wrap';
          const numEl=document.createElement('div'); numEl.className='counter-num'+(cfg.numbers.length>1?' small':''); numEl.dataset.value=n.value; numEl.dataset.plus=n.plus?'1':'0'; numEl.dataset.spoken=n.spoken; numEl.textContent='0';
          const lab=document.createElement('div'); lab.className='counter-label'; lab.textContent=n.spoken;
          cw.appendChild(numEl); cw.appendChild(lab); wrap.appendChild(cw);
        });
      }
    }
    screenContent.appendChild(wrap);
    // caption words
    const words=sc.text.split(/\\s+/).filter(Boolean);
    const wordBox=document.createElement('div'); wordBox.dataset.idx=si; wordBox.style.display='contents';
    const totalChars=words.reduce((a,w)=>a+w.length+1,0);
    let cum=0;
    words.forEach((w,wi)=>{
      const span=document.createElement('span'); span.className='word';
      // gold highlight
      if(sc.golds.some(g=> w.includes(g) || g.includes(w) || sc.text.includes(w) && sc.golds.join('').includes(w))){
        // check if this word is part of gold name
        const isGold = sc.golds.some(g=> sc.text.includes(g) && g.length>2 && (w.length>1));
        // simpler: if brand name words
        if(/ইসলামী|বিশ্বকোষ|আল|হাদিস|S2/.test(w) && sc.cfg.type==='brand') span.classList.add('gold');
        if(sc.cfg.type==='brand' || sc.cfg.type==='badge') span.classList.add('gold');
      }
      if(sc.golds.length>0 && (sc.cfg.type==='brand' || sc.cfg.type==='badge')){
        // all words gold for brand/badge
        span.classList.add('gold');
      }
      span.textContent=w;
      span.dataset.si=si; span.dataset.wi=wi;
      const weight=w.length+1;
      const startF=0.15 + (cum/totalChars)*Math.max(0.6, sc.end-sc.start-0.55);
      const endF=startF+0.4;
      span.dataset.st=startF; span.dataset.en=endF;
      cum+=weight;
      wordBox.appendChild(span);
    });
    captionText.appendChild(wordBox);
  });
}

function txtSplitLabels(txt){
  // split by commas, and, ।
  let parts=txt.split(/[,،।]/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1){
    parts=txt.split(/ এবং | ও /).map(s=>s.trim()).filter(Boolean);
  }
  // clean short
  return parts.filter(p=>p.length>0 && p.length<40);
}

window.init=function(raw, opts){
  optsGlobal=opts||{};
  initStars(); initPanels(); initParticles(); initEqualizer(40);
  scenes=parseTimestamps(raw);
  if(scenes.length===0) throw new Error('No scenes');
  totalDuration=scenes[scenes.length-1].end+0.5;
  // brand end
  const brandSc=scenes.find(s=> s.cfg? s.cfg.type==='brand' : /ইসলামী বিশ্বকোষ/.test(s.text));
  // need cfg first so build then find again
  buildDOMForScenes();
  const brand = scenes.find(s=> s.cfg.type==='brand');
  if(brand) brandSceneEnd=brand.end;
  else brandSceneEnd=5.6;
  const last=scenes[scenes.length-1];
  lastSceneStart=last.start;
  // check logo
  const logoImg=document.getElementById('logoImg');
  if(logoImg){ logoImg.src=optsGlobal.badge? 'assets/logo.png' : 'assets/logo.png'; }
  // initial seek
  window.seek(0);
  return totalDuration;
};

window.fit=function(){
  // reduce caption sizes
  const box=document.getElementById('captionBox');
  const txt=document.getElementById('captionText');
  const styles=getComputedStyle(txt);
  let size=parseFloat(styles.fontSize);
  // find starting size
  const len=(txt.textContent||'').length;
  // already set by CSS, but shrink loop
  for(let iter=0; iter<30; iter++){
    const h=txt.scrollHeight;
    const maxH=box.clientHeight;
    if(h<=maxH) break;
    size-=2;
    if(size<34) { size=34; break; }
    txt.style.fontSize=size+'px';
  }
  return {captionSize:size};
};

window.setAudio=function(env,fps){ audioEnvelope=env; audioFps=fps||30; };

function level(t){
  if(audioEnvelope && audioEnvelope.length>0){
    const idx=Math.floor(t*audioFps)%audioEnvelope.length;
    return audioEnvelope[idx];
  }
  return Math.max(0,Math.min(1, 0.38 + 0.20*Math.sin(3.1*t) + 0.12*Math.sin(7.7*t+1) ));
}

window.seek=function(t){
  const lv=level(t);
  // progress
  const progFill=document.getElementById('progressFill');
  if(progFill) progFill.style.width=(clamp(t/totalDuration,0,1)*100)+'%';
  // bg glow
  const bgGlow=document.getElementById('bgGlow');
  if(bgGlow){ bgGlow.style.opacity=(0.72+0.28*lv).toFixed(3); }
  // stars
  const stars=document.getElementById('stars');
  if(stars){
    const rot= (t*2.2)%360;
    stars.style.transform=`rotate(${rot}deg)`;
    stars.style.opacity=(0.10+0.07*lv).toFixed(3);
  }
  // particles
  const dots=document.querySelectorAll('.pdot');
  dots.forEach(el=>{
    const i=parseInt(el.dataset.i,10);
    const x = (i*211 + Math.sin(0.4*t + i)*40) % 1920;
    const y = 1080 - ((t*(20 + (i%7)*9) + i*131) % 1140);
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.opacity=(0.15 + 0.2*lv + 0.15*Math.abs(Math.sin(t+i))).toFixed(3);
  });
  // equalizer
  const bars=document.querySelectorAll('.eq-bar');
  bars.forEach((bar,i)=>{
    const wave=0.5+0.5*Math.abs(Math.sin(6*t + 0.7*i));
    const shape=0.65+0.35*Math.sin(0.45*i + 1);
    const h= 4 + 22* clamp(lv*1.15*wave*shape + 0.04,0,1);
    bar.style.height=h+'px';
    const col=MOOD_COLORS[ (currentScene&&currentScene.mood) || 'happy'];
    bar.style.background=`rgb(${col[0]},${col[1]},${col[2]})`;
    bar.style.opacity=(0.5+0.5*lv).toFixed(2);
  });
  // caption ang
  const capPanel=document.getElementById('captionPanel');
  if(capPanel){
    capPanel.style.setProperty('--ang', (t*90)+'deg');
    const moodCol = MOOD_COLORS[(currentScene&&currentScene.mood)||'happy'];
    capPanel.style.boxShadow=`0 20px 60px rgba(0,0,0,0.5), 0 0 ${24+80*lv}px rgba(${moodCol[0]},${moodCol[1]},${moodCol[2]},${0.22+0.45*lv}) , 0 0 ${4+14*lv}px rgba(${moodCol[0]},${moodCol[1]},${moodCol[2]},0.6)`;
  }
  // screen glow
  const screenGlow=document.getElementById('screenGlow');
  if(screenGlow){
    const moodCol=MOOD_COLORS[(currentScene&&currentScene.mood)||'happy'];
    screenGlow.style.background=`radial-gradient(60% 60% at 50% 40%, rgba(${moodCol[0]},${moodCol[1]},${moodCol[2]},${0.18+0.22*lv}), transparent 70%)`;
  }
  // onAir
  const onAirDot=document.getElementById('onAirDot');
  if(onAirDot){
    const sp = currentScene? 1:0; // simplified
    onAirDot.style.opacity= (0.4+0.6* (0.5+0.5*Math.sin(t*6)) * (currentScene?1:0.3)).toFixed(2);
    onAirDot.style.boxShadow=`0 0 ${8+12*lv}px #ff3b3b`;
    document.getElementById('onAir').style.boxShadow=`0 0 ${10+20*lv* (currentScene?1:0.2)}px rgba(233,196,106,0.25)`;
  }
  // logo card
  const logoCard=document.getElementById('logoCard');
  const logoInner=document.getElementById('logoCardInner');
  const ripple=document.getElementById('logoRipple');
  // find active scene
  let active=null;
  for(const sc of scenes){
    if(t>=sc.start-0.01 && t<=sc.end+0.01){ active=sc; break; }
  }
  currentScene=active;
  // logo visibility logic
  if(logoCard){
    // hidden until brand scene starts
    const brandStart=scenes.find(s=>s.cfg.type==='brand')?.start ?? 0;
    if(t<brandStart-0.01){
      logoCard.style.opacity='0';
      logoCard.style.transform='translate(0,0) scale(0.2)';
    } else {
      // phases
      if(t < brandStart){
        // hidden
      } else if(t < brandStart+0.9){
        const p=prog(t,brandStart,0.9);
        const sc= 0.2 + 0.8*easeBack(p);
        const op=easeOut(p);
        logoCard.style.opacity=op;
        logoCard.style.left='550px'; logoCard.style.top='535px'; logoCard.style.transform=`translate(-50%,-50%) scale(${sc})`;
        if(ripple){
          const rp=prog(t,brandStart+0.6,1.4);
          ripple.style.opacity=(easeOut(1-rp)*0.6).toFixed(2);
          ripple.style.transform=`translate(-50%,-50%) scale(${1+rp*0.6})`;
        }
      } else if(t < brandSceneEnd -0.4){
        logoCard.style.opacity='1';
        logoCard.style.left='550px'; logoCard.style.top='535px';
        const pulse=1+0.016*lv*Math.sin(t*2.5);
        logoCard.style.transform=`translate(-50%,-50%) scale(${pulse})`;
        logoInner.style.boxShadow=`0 20px 60px rgba(0,0,0,0.4), 0 0 ${30+90*lv}px rgba(233,196,106,0.3)`;
        if(ripple) ripple.style.opacity='0';
      } else if(t < brandSceneEnd+0.3){
        const p=prog(t,brandSceneEnd-0.4,0.7);
        const sx=550 + (210-550)*p;
        const sy=535 + (145-535)*p;
        const sc=1 + (0.5-1)*p;
        logoCard.style.left=sx+'px'; logoCard.style.top=sy+'px';
        logoCard.style.transform=`translate(-50%,-50%) scale(${sc})`;
        logoCard.style.opacity='1';
      } else if(t < lastSceneStart-0.01){
        logoCard.style.left='210px'; logoCard.style.top='145px';
        const pulse=1+0.016*lv*Math.sin(t*2.5);
        logoCard.style.transform=`translate(-50%,-50%) scale(${0.5*pulse})`;
        logoCard.style.opacity='1';
      } else {
        // return for last scene
        if(t < lastSceneStart+0.8){
          const p=prog(t,lastSceneStart,0.8);
          const sx=210 + (550-210)*p;
          const sy=145 + (460-145)*p;
          const sc=0.5 + (0.78-0.5)*easeBack(p);
          logoCard.style.left=sx+'px'; logoCard.style.top=sy+'px';
          logoCard.style.transform=`translate(-50%,-50%) scale(${sc})`;
          logoCard.style.opacity=String(easeOut(p));
        } else {
          logoCard.style.left='550px'; logoCard.style.top='460px';
          const pulse=1+0.016*lv*Math.sin(t*2.5);
          logoCard.style.transform=`translate(-50%,-50%) scale(${0.78*pulse})`;
          logoCard.style.opacity='1';
        }
      }
    }
  }

  // visuals per scene
  scenes.forEach(sc=>{
    const wrap=document.querySelector(`.visual-wrap[data-idx="${sc.idx}"]`);
    if(!wrap) return;
    const isActive = active && active.idx===sc.idx;
    const isLast = sc.idx===scenes.length-1;
    let vis=0;
    if(isActive){
      const enter= prog(t, sc.start, 0.45);
      const exit = isLast? 1 : 1 - prog(t, sc.end-0.3, 0.3);
      vis = easeOut(enter) * easeOut(exit);
    } else {
      vis=0;
    }
    wrap.style.opacity=vis;
    // translateY
    if(isActive){
      const enter=prog(t, sc.start, 0.45);
      const ty= (1-easeOut(enter))*40;
      wrap.style.transform=`translateY(${ty}px)`;
    }
    // mood glow
    const glowCol=MOOD_COLORS[sc.mood]||MOOD_COLORS.happy;
    wrap.style.background=`radial-gradient(60% 60% at 50% 40%, rgba(${glowCol[0]},${glowCol[1]},${glowCol[2]},${0.18*vis}), transparent 70%)`;
    // cards animation
    const cards=wrap.querySelectorAll('.card');
    cards.forEach(card=>{
      const j=parseInt(card.dataset.j||'0',10);
      const stagger= sc.start + 0.6 + j*0.18;
      if(t>=stagger-0.01){
        const p=prog(t,stagger,0.6);
        const e=easeBack(p);
        card.style.opacity=e;
        card.style.transform=`translateX(${(1-e)*80}px) scale(${0.85+0.15*e})`;
      } else {
        card.style.opacity='0';
        card.style.transform='translateX(80px) scale(0.85)';
      }
    });
    // counters
    const counters=wrap.querySelectorAll('.counter-num');
    counters.forEach(cnt=>{
      const val=parseInt(cnt.dataset.value,10);
      const startC= sc.start +0.4;
      if(t>=startC){
        const p=prog(t,startC, Math.min(3.2, Math.max(1.4, val>100000?3.0:1.6)));
        const cur=Math.floor(val*easeOut(p));
        cnt.textContent= cur.toLocaleString('bn-BD') + (cnt.dataset.plus==='1' && p>0.95 ? '+' : '');
      } else cnt.textContent='0';
    });
    // badge pop
    const badgeImg=wrap.querySelector('.badge-img');
    if(badgeImg && isActive){
      const p=prog(t, sc.start+0.4, 0.6);
      const scv=0.4 + 0.6*easeBack(p);
      const fl=Math.sin(t*2.2)*3*vis;
      badgeImg.style.opacity=easeOut(p);
      badgeImg.style.transform=`scale(${scv}) translateY(${fl}px)`;
    }
    const tapRing=wrap.querySelector('.tap-ring');
    if(tapRing && isActive){
      if(t>=sc.start+2.0){
        const cycle= (t-(sc.start+2.0))%1.3;
        const p=cycle/1.3;
        tapRing.style.opacity=String((1-p)*0.7*vis);
        tapRing.style.transform=`translate(-50%,-50%) scale(${1+p*0.9})`;
        tapRing.style.left='72%'; tapRing.style.top='58%';
      } else tapRing.style.opacity='0';
    }
    // closing emoji
    if(sc.cfg.type==='closing' && isActive){
      const row=wrap.querySelector('.closing-emoji-row');
      if(row){
        const p=prog(t, sc.start, 0.6);
        row.style.transform=`scale(${0.6+0.4*easeBack(p)})`;
        row.style.opacity=easeOut(p);
      }
    }
    // greeting scale
    if(sc.cfg.type==='greeting' && isActive){
      const ar=wrap.querySelector('.arabic-greeting');
      if(ar){
        const p=prog(t, sc.start, 0.6);
        const scv=0.85+0.15*easeBack(p);
        ar.style.transform=`scale(${scv})`;
        ar.style.opacity=easeOut(p);
      }
    }
  });

  // caption words
  const allWords=document.querySelectorAll('.word');
  allWords.forEach(w=>{
    const si=parseInt(w.dataset.si,10);
    const sc=scenes[si];
    if(!sc) return;
    const isActive = active && active.idx===si;
    if(!isActive){
      // hide if past
      if(t>sc.end+0.01){ w.style.opacity='0'; w.style.transform='translateY(26px)'; }
      else { w.style.opacity='0'; w.style.transform='translateY(26px)'; }
      return;
    }
    const lt= t - sc.start;
    const st=parseFloat(w.dataset.st);
    const en=parseFloat(w.dataset.en);
    // fade in
    if(lt>=st){
      const p=prog(lt,st,0.3);
      w.style.opacity=easeOut(p);
      w.style.transform=`translateY(${(1-easeOut(p))*26}px)`;
    } else {
      w.style.opacity='0';
      w.style.transform='translateY(26px)';
    }
    // active factor
    const aProgStart= prog(lt,st,0.12);
    const aProgEnd= prog(lt,en-0.05,0.14);
    const a = easeOut(aProgStart) * (1- easeOut(aProgEnd));
    if(a>0.01){
      w.classList.add('active');
      w.style.transform=`translateY(${-6*a}px) scale(${1+0.07*a})`;
    } else {
      w.classList.remove('active');
    }
  });

  // host animation
  const sp = active? 1:0;
  const head=document.getElementById('head');
  const mouthGroup=document.getElementById('mouthGroup');
  const mouth=document.getElementById('mouth');
  const armR=document.getElementById('armR');
  const brows=document.getElementById('brows');
  const pupilL=document.getElementById('pupilL');
  const pupilR=document.getElementById('pupilR');
  const lidL=document.getElementById('lidL');
  const lidR=document.getElementById('lidR');
  // mouth opening based on words
  let m=0;
  if(active){
    const wordsInScene=document.querySelectorAll(`.word[data-si="${active.idx}"]`);
    let maxA=0;
    wordsInScene.forEach((wd,idx)=>{
      const st=parseFloat(wd.dataset.st);
      const en=parseFloat(wd.dataset.en);
      const ltLocal=t-active.start;
      const aProgS=prog(ltLocal,st,0.12);
      const aProgE=prog(ltLocal,en-0.05,0.14);
      const a = easeOut(aProgS)*(1-easeOut(aProgE));
      if(a>maxA) maxA=a;
      const local = a * (0.30 + 0.70*Math.abs(Math.sin(ltLocal*13 + idx*1.7)));
      if(local>m) m=local;
    });
    m = m * (0.75 + 0.25*lv);
  }
  if(head){
    const ty= Math.sin(1.7*t)*1.5 - 3.5*m;
    const rot= Math.sin(0.8*t)*1.4 + sp*Math.sin(2.3*t)*0.9;
    head.setAttribute('transform', `translate(0,${ty}) rotate(${rot} 460 320)`);
  }
  const torso=document.getElementById('torso');
  if(torso){ torso.setAttribute('transform', `translate(0,${Math.sin(1.6*t)*2.2 + 3*lv*sp})`); }
  if(mouthGroup){
    mouthGroup.setAttribute('transform', `translate(460 380) scale(${1+0.18*m},${0.10+0.90*m}) translate(-460 -380)`);
  }
  if(mouth){
    mouth.setAttribute('ry', (3 + 12*m).toFixed(2));
  }
  if(brows){
    brows.setAttribute('transform', `translate(0,${-(2+6*lv*sp+2*m)})`);
  }
  if(pupilL && pupilR){
    pupilL.setAttribute('cx', (417+ Math.sin(t*0.7)*1.5).toFixed(1));
    pupilR.setAttribute('cx', (507+ Math.sin(t*0.7)*1.5).toFixed(1));
  }
  if(lidL && lidR){
    // blink periods 3.4s and 5.3s
    const blink = (period, offset)=>{
      const ph = (t+offset)%period;
      if(ph<0.16){
        const p= Math.sin((ph/0.16)*Math.PI);
        return p;
      }
      return 0;
    };
    const b1=blink(3.4,1.1);
    const b2=blink(5.3,0.3);
    const b=Math.max(b1,b2);
    const h= b*28;
    lidL.setAttribute('height', h.toFixed(1));
    lidR.setAttribute('height', h.toFixed(1));
    lidL.setAttribute('opacity', b>0? '1':'0');
    lidR.setAttribute('opacity', b>0? '1':'0');
  }
  if(armR){
    const wave=0.5+0.5*Math.sin(1.1*t);
    const rot= -(5 + 36*sp*(0.35+0.65*wave*(0.5+0.5*lv)));
    armR.style.transform=`rotate(${rot}deg)`;
    armR.style.transformOrigin='600px 440px';
  }
};
</script>
</body>
</html>
