<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Islamic Biswakosh Podcast Promo</title>
<style>
  /* বাংলা ফন্ট: SolaimanLipi (assets/fonts/ থেকে লোড হয়), ইংরেজি/লাতিন লেখা: Noto Serif */
  @font-face { font-family: 'SolaimanLipi'; src: url('assets/fonts/SolaimanLipi-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'SolaimanLipi'; src: url('assets/fonts/SolaimanLipi-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: block; }

  :root {
    --gold: #e9c46a;
    --gold-deep: #c9973a;
    --green-dark: #04210f;
    --green-mid: #0a4a2a;
    --green-light: #14804a;
    --cream: #fff8e6;
    /* Noto Serif-এ বাংলা গ্লিফ নেই, তাই বাংলা অক্ষর নিজে থেকে SolaimanLipi-তে যায় */
    --font-main: 'Noto Serif', 'SolaimanLipi', 'Noto Serif Bengali', 'Noto Sans Bengali', serif;
    --font-arabic: 'Noto Naskh Arabic', 'Amiri', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: var(--font-main); color: var(--cream); }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(90% 100% at 62% 35%, #0b3d24 0%, var(--green-dark) 62%, #021208 100%);
  }
  #glowBase {
    position: absolute; inset: 0;
    background:
      radial-gradient(40% 55% at 72% 38%, rgba(233,196,106,.20), transparent 70%),
      radial-gradient(50% 40% at 20% 20%, rgba(20,128,74,.30), transparent 70%);
  }
  /* rotating geometric star pattern on the studio wall */
  #pattern { position: absolute; left: 1450px; top: 380px; width: 1700px; height: 1700px; margin: -850px 0 0 -850px; opacity: .12; }
  #wall { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .particle { position: absolute; border-radius: 50%; background: var(--gold); }

  /* ON AIR sign */
  #onair {
    position: absolute; left: 1590px; top: 44px; width: 270px; height: 74px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(180deg, #2a0c0c, #170606); border: 3px solid rgba(233,196,106,.7);
    font-family: 'Noto Serif', serif; font-weight: 700; font-size: 38px; letter-spacing: 6px; color: #ff6b5e;
  }
  #onair i { width: 20px; height: 20px; border-radius: 50%; background: #ff3b30; display: block; }

  /* wall-mounted studio screen that shows the infographic scenes */
  #screen {
    position: absolute; left: 80px; top: 290px; width: 940px; height: 490px; border-radius: 30px;
    border: 6px solid rgba(233,196,106,.85);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 6px),
      linear-gradient(160deg, #08361f, #031709);
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }

  /* host (illustrated presenter) + desk */
  #host { position: absolute; left: 960px; top: 100px; width: 960px; height: 720px; overflow: visible; }
  #desk {
    position: absolute; left: 0; top: 800px; width: 1920px; height: 280px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 3px, transparent 3px 46px),
      linear-gradient(180deg, #6a4526 0%, #4a2d17 12%, #2d1a0c 100%);
    border-top: 6px solid var(--gold-deep);
    box-shadow: 0 -14px 40px rgba(0,0,0,.45);
  }

  #logoBox {
    position: absolute; left: 0; top: 0; width: 520px;
    border-radius: 56px; overflow: hidden; background: #fff;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 6px rgba(233,196,106,.9);
    will-change: transform; opacity: 0;
  }
  #logoBox img { display: block; width: 100%; height: auto; }
  #ring {
    position: absolute; left: 290px; top: 324px; width: 520px; height: 421px;
    border-radius: 60px; border: 4px solid var(--gold); opacity: 0; pointer-events: none;
  }

  /* scenes */
  .scene { position: absolute; inset: 0; opacity: 0; }
  .sceneGlow { position: absolute; inset: 0; }
  .visual { position: absolute; left: 80px; top: 290px; width: 940px; height: 490px; }

  /* ---------- reactive caption panel (lower third) ---------- */
  .panel { position: absolute; left: 60px; right: 60px; top: 836px; height: 196px; border-radius: 48px; }
  .panelBorder {
    position: absolute; inset: 0; border-radius: 48px;
    background: conic-gradient(from var(--ang, 0deg),
      rgba(255,236,170,1), rgba(233,196,106,.12) 22%, rgba(201,151,58,.95) 50%, rgba(233,196,106,.12) 78%, rgba(255,236,170,1));
  }
  .panelFill {
    position: absolute; inset: 6px; border-radius: 43px; overflow: hidden;
    background:
      radial-gradient(70% 90% at 50% 0%, rgba(20,128,74,.60), transparent 72%),
      radial-gradient(60% 70% at 50% 110%, rgba(233,196,106,.16), transparent 70%),
      linear-gradient(165deg, #0c3d24, #041a0e);
  }
  .panelDots {
    position: absolute; inset: 0; opacity: .55;
    background-image: radial-gradient(rgba(233,196,106,.10) 2.5px, transparent 3.5px);
    background-size: 38px 38px; background-position: 10px 10px;
  }
  .panelShine {
    position: absolute; top: -20%; bottom: -20%; width: 18%; left: -40%;
    background: linear-gradient(100deg, transparent, rgba(255,248,230,.13), transparent);
    transform: skewX(-18deg);
  }
  .orn { position: absolute; top: 50%; margin-top: -28px; font-size: 34px; color: var(--gold); opacity: .9; }
  .orn.l { left: 26px; } .orn.r { right: 26px; }
  .caption {
    position: absolute; left: 76px; right: 76px; top: 16px; bottom: 44px;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    gap: 2px 16px; text-align: center;
    font-size: 56px; line-height: 1.25; font-weight: 700;
  }
  .caption .w { display: inline-block; opacity: 0; color: var(--cream); text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  .caption .hl { color: var(--gold); }
  .eq {
    position: absolute; left: 130px; right: 130px; bottom: 12px; height: 26px;
    display: flex; align-items: flex-end; gap: 9px;
  }
  .eq i { flex: 1; height: 4px; border-radius: 4px; background: linear-gradient(180deg, var(--gold), var(--gold-deep)); opacity: .85; }

  /* cards */
  .cards { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  .card {
    min-width: 600px; max-width: 840px; padding: 20px 40px; border-radius: 32px;
    display: flex; align-items: center; gap: 30px; opacity: 0;
    background: linear-gradient(135deg, rgba(255,248,230,.14), rgba(255,248,230,.05));
    border: 3px solid rgba(233,196,106,.55);
    box-shadow: 0 16px 44px rgba(0,0,0,.35);
  }
  .card .ic { font-size: 84px; line-height: 1; font-family: 'Noto Color Emoji', sans-serif; }
  .card .lb { font-size: 54px; font-weight: 700; color: var(--cream); line-height: 1.25; }
  .cards.three .card { padding: 14px 36px; }
  .cards.three .card .ic { font-size: 70px; }
  .cards.three .card .lb { font-size: 46px; }

  /* stats */
  .stats { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .stat { text-align: center; opacity: 0; }
  .stat .num {
    font-size: 150px; font-weight: 700; line-height: 1.1; color: var(--gold);
    text-shadow: 0 0 50px rgba(233,196,106,.45), 0 8px 24px rgba(0,0,0,.5);
  }
  .stat .num.sm { font-size: 118px; }
  .stat .lbl { font-size: 50px; font-weight: 700; color: var(--cream); margin-top: -4px; }

  /* salam */
  .arabic {
    position: absolute; left: 0; right: 0; top: 120px; text-align: center;
    font-family: var(--font-arabic); font-size: 130px; line-height: 1.5; font-weight: 700;
    color: var(--gold); text-shadow: 0 0 50px rgba(233,196,106,.5); opacity: 0;
  }

  /* install: official Google Play badge (if assets/google-play-badge.png exists) or generic button */
  .installWrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  .installWrap.end { justify-content: flex-end; padding-bottom: 26px; }
  .badgeWrap { position: relative; display: flex; justify-content: center; opacity: 0; }
  .badge { width: 580px; height: auto; display: block; filter: drop-shadow(0 18px 32px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(233,196,106,.35)); }
  .tapRing {
    position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    border: 6px solid rgba(255,248,230,.95); opacity: 0; pointer-events: none;
  }
  .installBtn {
    display: flex; align-items: center; gap: 24px; padding: 28px 54px; border-radius: 100px; opacity: 0;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #1b1203;
    font-size: 48px; font-weight: 700; box-shadow: 0 20px 56px rgba(0,0,0,.5), 0 0 70px rgba(233,196,106,.45);
  }
  .installBtn .play { font-size: 60px; }
  .appName { font-size: 40px; font-weight: 700; color: var(--gold); opacity: 0; text-align: center; line-height: 1.35; }
  .share {
    display: flex; gap: 36px; align-items: center; justify-content: center; font-size: 62px; opacity: 0;
    font-family: 'Noto Color Emoji', sans-serif;
  }

  /* progress bar */
  #progressWrap { position: absolute; left: 60px; right: 60px; bottom: 22px; height: 8px; border-radius: 5px; background: rgba(255,248,230,.15); }
  #progress { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); }
  #vignette { position: absolute; inset: 0; background: radial-gradient(120% 110% at 50% 45%, transparent 58%, rgba(0,0,0,.55) 100%); pointer-events: none; }
</style>
</head>

<script>
/* ------------------------------------------------------------------
   Deterministic timeline: everything is a pure function of time t
   (and of the audio level at time t, if audio.mp3 is present).
   The renderer calls window.seek(t) and takes a screenshot.
------------------------------------------------------------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const toBn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const fmtBn = n => toBn(Math.round(n).toLocaleString('en-US'));
const $ = id => document.getElementById(id);

/* mood -> accent colour (used for scene glow and the panel's reactive glow) */
const MOOD_RGB = {
  respectful: [233, 196, 106],
  happy: [255, 190, 90],
  informative: [60, 200, 170],
  excited: [170, 230, 80],
  calm: [110, 170, 255],
  enthusiastic: [255, 160, 70]
};
const CREAM = [255, 248, 230], GOLD = [233, 196, 106];

/* extra visuals per scene index (same order as timestamps.txt) */
const EXTRA = [
  { type: 'salam' },
  { type: 'brand' },
  { type: 'cards', items: [['📖', 'কানযুল ঈমান', 0.6], ['📖', 'ইরফানুল কুরআন', 2.6]] },
  { type: 'cards', items: [['📚', 'তাফসীরে মাযহারী', 0.4]] },
  { type: 'cards', items: [['📚', 'তাফসীরে খাযাইনুল ইরফান', 0.3]], stat: { to: 8, suffix: 'টি তাফসীর চলমান', at: 1.6 } },
  { type: 'stats', items: [{ to: 45, label: 'টি হাদিস গ্রন্থ', at: 0.5, dur: 2.2 }, { to: 270335, label: 'টি হাদিস', at: 3.0, dur: 3.2, small: true }] },
  { type: 'stats', items: [{ to: 800, plus: true, label: 'অফলাইন কিতাব', at: 0.2, dur: 1.4 }] },
  { type: 'stats', items: [{ to: 1000, plus: true, label: 'অনলাইন পিডিএফ বই', at: 0.2, dur: 1.8 }] },
  { type: 'cards', items: [['✍️', 'লেখকভিত্তিক', 0.3], ['🗂️', 'বিষয়ভিত্তিক', 1.4]] },
  { type: 'cards', items: [['⏰', 'নামাজের সময়', 0.2], ['🌙', 'সেহরি ও ইফতার', 1.0]] },
  { type: 'cards', items: [['🧭', 'কিবলা কম্পাস', 0.2], ['🕌', 'মসজিদ খুঁজি', 1.0]] },
  { type: 'cards', items: [['📿', 'ডিজিটাল তাসবিহ', 0.3], ['✨', 'সব কিছু এক অ্যাপেই', 1.6]] },
  { type: 'cards', items: [['🎙️', 'বয়ান', 0.2], ['🎵', 'নাত', 1.0]] },
  { type: 'cards', three: true, items: [['🤲', 'মাসনুন দোয়া', 0.2], ['🏷️', 'ইসলামিক নাম', 1.2], ['📡', 'লাইভ হারামাইন', 2.2]] },
  { type: 'install' },
  { type: 'share' }
];

let SCENES = [];       // {start,end,text,mood,el,...}
let TOTAL = 0;
let OPTS = {};
let AUDIO = null;      // { env:[0..1 per frame], fps }
let BRAND_START = 0, SHRINK_AT = 5.6, CLOSE_AT = Infinity;   // logo choreography (derived from the scenes)

/* audio level 0..1 at time t: real envelope from audio.mp3 if available, otherwise a soft synthetic pulse */
window.setAudio = function (env, fps) { AUDIO = env && env.length ? { env, fps } : null; };
function level(t) {
  if (AUDIO) return AUDIO.env[Math.floor(t * AUDIO.fps) % AUDIO.env.length] || 0;
  return clamp(0.38 + 0.20 * Math.sin(t * 3.1) + 0.12 * Math.sin(t * 7.7 + 1));
}

/* ---------- build static background bits ---------- */
(function buildBackground() {
  const set = $('starSet');
  let html = '';
  for (let r = 20; r <= 95; r += 15) {
    html += `<g transform="rotate(${r})"><rect x="${-r / 2}" y="${-r / 2}" width="${r}" height="${r}"/></g>`;
    html += `<g transform="rotate(${r + 45})"><rect x="${-r / 2}" y="${-r / 2}" width="${r}" height="${r}"/></g>`;
  }
  html += '<circle r="97"/><circle r="60"/><circle r="30"/>';
  set.innerHTML = html;

  /* studio wall: acoustic panels behind the host, a shelf with books, a plant */
  let w = '';
  for (let i = 0; i < 8; i++) {
    const x = 1000 + i * 112;
    w += `<rect x="${x}" y="150" width="96" height="560" rx="18" fill="rgba(10,74,42,.55)" stroke="rgba(233,196,106,.20)" stroke-width="2"/>`;
    for (let g = 1; g < 14; g++) w += `<line x1="${x + 10}" y1="${150 + g * 40}" x2="${x + 86}" y2="${150 + g * 40}" stroke="rgba(0,0,0,.18)" stroke-width="3"/>`;
  }
  const bookColors = ['#c9973a', '#14804a', '#f2e8c9', '#7a2e2e', '#2d5a8a', '#e9c46a', '#0a4a2a'];
  let bx = 380;
  for (let i = 0; i < 18; i++) {
    const bw = 18 + ((i * 7) % 14), bh = 80 + ((i * 13) % 56);
    w += `<rect x="${bx}" y="${230 - bh}" width="${bw}" height="${bh}" rx="3" fill="${bookColors[i % bookColors.length]}" opacity=".9"/>`;
    w += `<rect x="${bx + 3}" y="${230 - bh + 12}" width="${bw - 6}" height="4" fill="rgba(0,0,0,.25)"/>`;
    bx += bw + 4;
  }
  w += `<rect x="370" y="230" width="${bx - 360}" height="12" rx="4" fill="#5a3b22"/><rect x="370" y="230" width="${bx - 360}" height="3" fill="#e9c46a" opacity=".6"/>`;
  // plant (right side, behind the desk)
  w += '<rect x="1812" y="700" width="70" height="100" rx="12" fill="#6a4526"/>';
  [[-28, 560], [-12, 520], [6, 540], [24, 580], [40, 620]].forEach(([dx, dy], i) => {
    w += `<ellipse cx="${1847 + dx}" cy="${dy + 90}" rx="22" ry="86" fill="${i % 2 ? '#14804a' : '#0e6a3c'}" transform="rotate(${dx * 1.1} ${1847} 700)"/>`;
  });
  $('wall').innerHTML = w;

  const wrap = $('particles');
  for (let i = 0; i < 38; i++) {
    const d = document.createElement('div');
    d.className = 'particle';
    const s = 4 + (i * 7) % 9;
    d.style.width = d.style.height = s + 'px';
    d.dataset.i = i;
    wrap.appendChild(d);
  }
})();

/* ---------- parse + build scenes ---------- */
window.init = function (rawText, opts) {
  OPTS = opts || {};
  TOTAL = 0;
  const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const holder = $('scenes');
  holder.innerHTML = '';
  SCENES = lines.map((line, idx) => {
    const p = line.split('|').map(s => s.trim());
    const sc = { start: parseFloat(p[0]), end: parseFloat(p[1]), text: p[2], mood: (p[3] || 'happy').toLowerCase(), extra: EXTRA[idx] || {} };
    sc.rgb = MOOD_RGB[sc.mood] || MOOD_RGB.happy;
    TOTAL = Math.max(TOTAL, sc.end);
    buildScene(sc);
    holder.appendChild(sc.el);
    return sc;
  });
  TOTAL += 0.5; // short hold at the end

  // logo choreography derived from the scenes
  const brand = SCENES.find(s => s.extra.type === 'brand');
  const share = SCENES.find(s => s.extra.type === 'share');
  BRAND_START = brand ? brand.start : 0;
  SHRINK_AT = brand ? brand.end - 0.4 : 5.6;
  CLOSE_AT = share ? share.start : Infinity;
  return TOTAL;
};

function buildScene(sc) {
  const el = document.createElement('div');
  el.className = 'scene';
  const glow = document.createElement('div');
  glow.className = 'sceneGlow';
  glow.style.background = `radial-gradient(34% 50% at 28% 50%, rgba(${sc.rgb[0]},${sc.rgb[1]},${sc.rgb[2]},.30), transparent 75%)`;
  el.appendChild(glow);

  const vis = document.createElement('div');
  vis.className = 'visual';
  el.appendChild(vis);
  const ex = sc.extra;

  if (ex.type === 'salam') {
    vis.innerHTML = '<div class="arabic">اَلسَّلَامُ عَلَيْكُمْ</div>';
    sc.arabic = vis.firstChild;
  } else if (ex.type === 'cards') {
    const c = document.createElement('div');
    c.className = 'cards' + (ex.three ? ' three' : '');
    sc.cards = ex.items.map(it => {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<span class="ic">${it[0]}</span><span class="lb">${it[1]}</span>`;
      c.appendChild(d);
      return { el: d, at: it[2] };
    });
    if (ex.stat) {
      const s = document.createElement('div');
      s.className = 'stat';
      s.style.marginTop = '6px';
      s.innerHTML = `<div class="num sm"></div><div class="lbl">${ex.stat.suffix}</div>`;
      c.appendChild(s);
      sc.cardStat = { el: s, num: s.querySelector('.num'), cfg: ex.stat };
      c.style.gap = '8px';
    }
    vis.appendChild(c);
  } else if (ex.type === 'stats') {
    const c = document.createElement('div');
    c.className = 'stats';
    sc.stats = ex.items.map(it => {
      const d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = `<div class="num ${it.small ? 'sm' : ''}"></div><div class="lbl">${it.label}</div>`;
      c.appendChild(d);
      return { el: d, num: d.querySelector('.num'), cfg: it };
    });
    vis.appendChild(c);
  } else if (ex.type === 'install') {
    if (OPTS.badge) {
      // official Google Play badge image supplied by the user
      vis.innerHTML = `<div class="installWrap">
          <div class="badgeWrap"><img class="badge" src="${OPTS.badge}" alt="Google Play"><div class="tapRing"></div></div>
          <div class="appName">ইসলামী বিশ্বকোষ ও আল হাদিস S2</div>
        </div>`;
      sc.badgeWrap = vis.querySelector('.badgeWrap');
      sc.tapRing = vis.querySelector('.tapRing');
    } else {
      // fallback: generic install button (no third-party logo)
      vis.innerHTML = `<div class="installWrap">
          <div class="installBtn"><span class="play">▶</span><span>প্লে স্টোর থেকে ইনস্টল করুন</span></div>
          <div class="appName">ইসলামী বিশ্বকোষ ও আল হাদিস S2</div>
        </div>`;
      sc.btn = vis.querySelector('.installBtn');
    }
    sc.appName = vis.querySelector('.appName');
  } else if (ex.type === 'share') {
    vis.innerHTML = `<div class="installWrap end"><div class="share"><span>📖</span><span>🤝</span><span>🕌</span></div></div>`;
    sc.share = vis.querySelector('.share');
  }

  // ---- reactive caption panel (lower third) ----
  const panel = document.createElement('div');
  panel.className = 'panel';
  const border = document.createElement('div'); border.className = 'panelBorder';
  const fill = document.createElement('div'); fill.className = 'panelFill';
  const dots = document.createElement('div'); dots.className = 'panelDots';
  const shine = document.createElement('div'); shine.className = 'panelShine';
  fill.appendChild(dots); fill.appendChild(shine);
  const ornL = document.createElement('div'); ornL.className = 'orn l'; ornL.textContent = '✦';
  const ornR = document.createElement('div'); ornR.className = 'orn r'; ornR.textContent = '✦';
  const cap = document.createElement('div'); cap.className = 'caption';
  const eq = document.createElement('div'); eq.className = 'eq';
  sc.bars = [];
  for (let i = 0; i < 40; i++) { const b = document.createElement('i'); eq.appendChild(b); sc.bars.push(b); }

  // words (app name between ❝ ❞ is highlighted)
  let hl = false;
  sc.words = sc.text.split(/\s+/).map(tok => {
    if (tok.includes('❝')) hl = true;
    const s = document.createElement('span');
    s.className = 'w' + (hl ? ' hl' : '');
    s.textContent = tok.replace(/[❝❞]/g, '');
    s.dataset.hl = hl ? '1' : '';
    if (tok.includes('❞')) hl = false;
    cap.appendChild(s);
    return s;
  });

  // estimated "spoken" timing of each word, proportional to its length
  const dur = sc.end - sc.start;
  const lens = sc.words.map(w => (w.textContent || '').length + 1);
  const sum = lens.reduce((a, b) => a + b, 0) || 1;
  const win = Math.max(0.6, dur - 0.55);
  let cum = 0;
  sc.wordT = lens.map(l => { const st = 0.15 + (cum / sum) * win; cum += l; return st; });

  panel.appendChild(border); panel.appendChild(fill); panel.appendChild(ornL); panel.appendChild(ornR); panel.appendChild(cap); panel.appendChild(eq);
  el.appendChild(panel);
  sc.el = el; sc.glow = glow; sc.panel = panel; sc.border = border; sc.shine = shine; sc.cap = cap;
}

/* Shrink each caption until it fits the panel. Call once after the fonts have loaded. */
window.fit = function () {
  const sizes = [];
  SCENES.forEach(sc => {
    let size = sc.text.length <= 50 ? 64 : 56;
    sc.cap.style.fontSize = size + 'px';
    for (let n = 0; n < 30; n++) {
      let top = 1e9, bottom = 0;
      sc.words.forEach(w => { top = Math.min(top, w.offsetTop); bottom = Math.max(bottom, w.offsetTop + w.offsetHeight); });
      if (!((bottom - top) > sc.cap.clientHeight + 1)) break;   // fits (or not measurable)
      size -= 2;
      if (size < 34) break;
      sc.cap.style.fontSize = size + 'px';
    }
    sizes.push(size);
  });
  return sizes;
};

/* ---------- host animation ---------- */
function blinkAmount(t, period, offset) {
  const p = (t + offset) % period;
  return p < 0.16 ? Math.sin((p / 0.16) * Math.PI) : 0;
}
function animateHost(t, lv, sp, mouth) {
  const blink = Math.max(blinkAmount(t, 3.4, 0), blinkAmount(t, 5.3, 1.1));
  const bob = Math.sin(t * 1.6) * 2.2 + lv * 3 * sp;
  $('upper').style.transform = `translateY(${bob.toFixed(2)}px)`;
  const nod = Math.sin(t * 1.7) * 1.5 - mouth * 3.5;
  const tilt = Math.sin(t * 0.8) * 1.4 + sp * Math.sin(t * 2.3) * 0.9;
  $('head').style.transform = `translateY(${nod.toFixed(2)}px) rotate(${tilt.toFixed(2)}deg)`;
  $('mouth').style.transform = `scale(${(1 + 0.18 * mouth).toFixed(3)}, ${(0.10 + 0.90 * mouth).toFixed(3)})`;
  $('lidL').style.transform = `scaleY(${blink.toFixed(3)})`;
  $('lidR').style.transform = `scaleY(${blink.toFixed(3)})`;
  const browY = -(2 + 6 * lv * sp + 2 * mouth);
  $('browL').style.transform = `translateY(${browY.toFixed(2)}px)`;
  $('browR').style.transform = `translateY(${browY.toFixed(2)}px)`;
  $('pupils').style.transform = `translate(${(Math.sin(t * 0.6) * 3).toFixed(2)}px, ${(Math.sin(t * 0.9) * 1.2).toFixed(2)}px)`;
  // gesturing hand: lifts while talking
  const wave = 0.5 + 0.5 * Math.sin(t * 1.1);
  const ang = -(5 + 36 * sp * (0.35 + 0.65 * wave * (0.5 + 0.5 * lv)));
  $('armR').style.transform = `rotate(${ang.toFixed(2)}deg)`;
  // ON AIR sign + screen glow react to the speech and the audio level
  $('onair').style.boxShadow = `0 0 ${(8 + 34 * lv * sp).toFixed(1)}px rgba(255,59,48,${(0.15 + 0.6 * sp).toFixed(3)})`;
  $('onairDot').style.opacity = (0.35 + 0.65 * sp * (0.6 + 0.4 * Math.sin(t * 6))).toFixed(3);
  $('screen').style.boxShadow = `0 24px 60px rgba(0,0,0,.55), 0 0 ${(24 + 70 * lv).toFixed(1)}px rgba(233,196,106,${(0.18 + 0.30 * lv).toFixed(3)})`;
}

/* ---------- per-frame update ---------- */
window.seek = function (t) {
  const lv = level(t);

  /* background */
  $('pattern').style.transform = `rotate(${t * 2.2}deg)`;
  $('pattern').style.opacity = (0.10 + 0.07 * lv).toFixed(3);
  $('glowBase').style.opacity = (0.72 + 0.28 * lv).toFixed(3);
  document.querySelectorAll('.particle').forEach(p => {
    const i = +p.dataset.i;
    const x = (i * 211 + Math.sin(t * .4 + i) * 40) % 1920;
    const y = 1080 - ((t * (20 + (i % 7) * 9) + i * 131) % 1140);
    p.style.transform = `translate(${(x + 1920) % 1920}px, ${y}px)`;
    p.style.opacity = (.15 + .25 * (0.5 + 0.5 * Math.sin(t * 1.3 + i * 2)) + 0.2 * lv).toFixed(3);
  });
  $('progress').style.width = (clamp(t / TOTAL) * 100).toFixed(2) + '%';

  /* logo: hero on the studio screen during the brand scene, then a small badge at the top-left,
     and back on the screen for the closing scene */
  const logo = $('logoBox');
  const ring = $('ring');
  const intro = easeBack(prog(t, BRAND_START, 0.9));
  const introF = t < SHRINK_AT ? 0.2 + 0.8 * intro : 1;
  const kS = easeInOut(prog(t, SHRINK_AT, 0.7));                 // big -> small
  const kC = easeInOut(prog(t, CLOSE_AT, 0.8));                  // small -> closing size
  let cx = lerp(550, 210, kS), cy = lerp(535, 145, kS), sc0 = lerp(1, 0.5, kS);
  cx = lerp(cx, 550, kC); cy = lerp(cy, 460, kC); sc0 = lerp(sc0, 0.78, kC);
  const pulse = 1 + 0.010 * Math.sin(t * 2.2) + 0.016 * lv;
  logo.style.opacity = easeOut(prog(t, BRAND_START, 0.5)).toFixed(3);
  logo.style.transformOrigin = '50% 50%';
  logo.style.transform = `translate(${(cx - 260).toFixed(1)}px, ${(cy - 210.5).toFixed(1)}px) scale(${(sc0 * introF * pulse).toFixed(4)})`;
  logo.style.boxShadow = `0 30px 80px rgba(0,0,0,.55), 0 0 0 6px rgba(233,196,106,.9), 0 0 ${(30 + 90 * lv).toFixed(1)}px rgba(233,196,106,${(0.15 + 0.4 * lv).toFixed(3)})`;
  const rp = prog(t, BRAND_START + 0.1, 1.4);
  ring.style.opacity = rp > 0 && rp < 1 ? ((1 - rp) * 0.9).toFixed(3) : 0;
  ring.style.transform = `scale(${(1 + rp * 0.45).toFixed(3)})`;

  /* scenes */
  let sp = 0;          // how strongly someone is "on mic" right now (0..1)
  let mouth = 0;       // mouth opening 0..1 (driven by the spoken-word timing and the audio level)
  SCENES.forEach(sc => {
    const lt = t - sc.start, dur = sc.end - sc.start;
    if (t < sc.start - 0.01 || t > sc.end + 0.01) { sc.el.style.opacity = 0; return; }
    const inP = easeOut(prog(lt, 0, 0.45));
    const outP = prog(lt, dur - 0.3, 0.3);
    const isLast = sc === SCENES[SCENES.length - 1];
    const op = inP * (isLast ? 1 : 1 - easeInOut(outP));
    sc.el.style.opacity = op.toFixed(3);
    sc.el.style.transform = `translateY(${(1 - inP) * 40}px)`;
    sp = Math.max(sp, op);

    /* reactive caption panel: rotating border, audio-driven glow, light sweep, equalizer */
    const [r, g, b] = sc.rgb;
    sc.border.style.setProperty('--ang', ((t * 90) % 360).toFixed(2) + 'deg');
    sc.panel.style.boxShadow =
      `0 24px 70px rgba(0,0,0,.55), 0 0 ${(24 + 80 * lv).toFixed(1)}px ${(4 + 14 * lv).toFixed(1)}px rgba(${r},${g},${b},${(0.22 + 0.45 * lv).toFixed(3)})`;
    sc.shine.style.left = ((((lt * 0.4) % 2.0) - 0.5) * 100).toFixed(1) + '%';
    sc.bars.forEach((bar, i) => {
      const wave = 0.5 + 0.5 * Math.abs(Math.sin(t * 6 + i * 0.7));
      const shape = 0.65 + 0.35 * Math.sin(i * 0.45 + 1);
      bar.style.height = (4 + 22 * clamp(lv * 1.15 * wave * shape + 0.04)).toFixed(1) + 'px';
    });

    /* karaoke-style words: fade in, then the currently "spoken" word glows gold and lifts slightly */
    sc.words.forEach((w, i) => {
      const st = sc.wordT[i];
      const en = i + 1 < sc.wordT.length ? sc.wordT[i + 1] : dur - 0.15;
      const reveal = easeOut(prog(lt, st - 0.05, 0.3));
      const a = easeOut(prog(lt, st, 0.12)) * (1 - easeOut(prog(lt, en - 0.05, 0.14)));
      w.style.opacity = reveal.toFixed(3);
      w.style.transform = `translateY(${((1 - reveal) * 26 - 6 * a).toFixed(1)}px) scale(${(1 + 0.07 * a).toFixed(3)})`;
      if (!w.dataset.hl) {
        w.style.color = `rgb(${Math.round(lerp(CREAM[0], GOLD[0], a))},${Math.round(lerp(CREAM[1], GOLD[1], a))},${Math.round(lerp(CREAM[2], GOLD[2], a))})`;
      }
      w.style.textShadow = `0 0 ${(34 * a).toFixed(1)}px rgba(233,196,106,${(0.85 * a).toFixed(3)}), 0 4px 24px rgba(0,0,0,.6)`;
      // lip-sync: while a word is "spoken" the mouth opens and closes like syllables
      if (a > 0.001) mouth = Math.max(mouth, a * (0.30 + 0.70 * Math.abs(Math.sin(lt * 13 + i * 1.7))));
    });

    // visuals
    if (sc.arabic) {
      const p = easeOut(prog(lt, 0.05, 0.6));
      sc.arabic.style.opacity = p;
      sc.arabic.style.transform = `scale(${0.85 + 0.15 * p})`;
    }
    if (sc.cards) sc.cards.forEach(c => {
      const p = easeBack(prog(lt, c.at, 0.6));
      c.el.style.opacity = clamp(p * 1.4);
      c.el.style.transform = `translateX(${(1 - p) * 260}px) scale(${0.85 + 0.15 * p})`;
    });
    if (sc.cardStat) {
      const cfg = sc.cardStat.cfg;
      const p = prog(lt, cfg.at, 0.6);
      sc.cardStat.el.style.opacity = easeOut(p);
      sc.cardStat.num.textContent = toBn(Math.round(cfg.to * easeOut(prog(lt, cfg.at, 1.2))));
    }
    if (sc.stats) sc.stats.forEach(s => {
      const cfg = s.cfg;
      const p = easeOut(prog(lt, cfg.at, 0.5));
      s.el.style.opacity = p;
      s.el.style.transform = `scale(${0.8 + 0.2 * easeBack(prog(lt, cfg.at, 0.6))})`;
      const v = cfg.to * easeOut(prog(lt, cfg.at, cfg.dur));
      s.num.textContent = fmtBn(v) + (cfg.plus ? '+' : '');
    });
    if (sc.badgeWrap) {
      const p = easeBack(prog(lt, 0.4, 0.7));
      sc.badgeWrap.style.opacity = clamp(p * 1.4);
      sc.badgeWrap.style.transform = `scale(${0.7 + 0.3 * p + 0.02 * Math.sin(lt * 4) + 0.02 * lv})`;
      sc.appName.style.opacity = easeOut(prog(lt, 1.2, 0.6));
      // repeating "tap" ripple on the badge
      const tp = lt > 2.0 ? ((lt - 2.0) % 1.3) / 1.3 : 0;
      sc.tapRing.style.left = '72%';
      sc.tapRing.style.top = '58%';
      sc.tapRing.style.opacity = lt > 2.0 ? (1 - tp) * 0.9 : 0;
      sc.tapRing.style.transform = `scale(${0.35 + 1.1 * tp})`;
    }
    if (sc.btn) {
      const p = easeBack(prog(lt, 0.4, 0.7));
      sc.btn.style.opacity = clamp(p * 1.4);
      sc.btn.style.transform = `scale(${0.7 + 0.3 * p + 0.025 * Math.sin(lt * 5)})`;
      sc.appName.style.opacity = easeOut(prog(lt, 1.2, 0.6));
    }
    if (sc.share) {
      sc.share.style.opacity = easeOut(prog(lt, 0.4, 0.6));
      sc.share.style.transform = `scale(${0.8 + 0.2 * easeBack(prog(lt, 0.4, 0.7))})`;
    }
  });

  animateHost(t, lv, sp, mouth * (0.75 + 0.25 * lv));
};
</script>
</body>
</html>
